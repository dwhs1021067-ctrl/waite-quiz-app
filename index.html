  var map = { '國文':'📜', '綜合法政知識':'⚖️', '外國文':'🌐',
    '國際公法':'🏛️', '國際關係與近代外交史':'🗺️', '國際經濟':'💹' };
  return map[name] || '👾';
}
function accSection(key, title, sub, bodyHtml, defaultOpen){
  var open = ADV_OPEN.hasOwnProperty(key) ? ADV_OPEN[key] : !!defaultOpen;
  return '<div class="accSection">' +
    '<button class="accHead" data-acc="' + key + '" aria-expanded="' + open + '">' +
      '<span class="accTitle">' + esc(title) + '</span>' +
      (sub ? '<span class="accSub">' + esc(sub) + '</span>' : '') +
      '<span class="accChevron">' + (open ? '▾' : '▸') + '</span>' +
    '</button>' +
    (open ? '<div class="accBody">' + bodyHtml + '</div>' : '') +
  '</div>';
}

function renderAdventure(){
  if (S && S.mode === 'battle'){ renderBattle(); return; }

  var lv = D.rpg.level, need = xpForLevel(lv), pct = Math.min(100, Math.round(D.rpg.xp/need*100));
  var atk = rpgAtk(), hp = rpgMaxHp(), lootB = rpgLootBonus(), dmgR = rpgDmgReduction();
  var goldB = Math.round((rpgGoldMult() - 1) * 100), xpB = Math.round((rpgXpMult() - 1) * 100);
  var equippedCount = equipList('weapon').length + equipList('accessory').length + equipList('relic').length +
    (D.rpg.equip.armor ? 1 : 0) + (D.rpg.equip.helmet ? 1 : 0) + (D.rpg.equip.boots ? 1 : 0);
  var badgeCount = Array.isArray(D.rpg.badges) ? D.rpg.badges.length : 0;
  var due = BANK.filter(function(q){ return dueQ(q.id); }).length;

  $('#s-adventure').innerHTML =
    '<h2 class="sec">角色</h2>' +
    '<div class="charCard">' +
      '<button class="avatar" id="avatarBtn" aria-label="更換造型">' + D.rpg.avatar + '</button>' +
      '<div class="charInfo">' +
        '<div class="lvRow">Lv.' + lv + '<span class="gold">💰 ' + D.rpg.gold + '</span></div>' +
        '<div class="titleTag">' + esc(currentTitle(lv)) + '</div>' +
        '<div class="xpBar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="xpLab">' + D.rpg.xp + ' / ' + need + ' EXP</div>' +
      '</div>' +
    '</div>' +
    (SHOW_AVATAR_PICKER ? '<div class="card" style="margin-top:8px">' + avatarPickerHTML() + '</div>' : '') +
    '<div class="statRow">' +
      '<span>⚔️ 攻擊 ' + atk + '</span><span>❤️ 生命 ' + hp + '</span>' +
      '<span>💰 金幣 +' + goldB + '%</span><span>⭐ 經驗 +' + xpB + '%</span>' +
      '<span>🎁 掉寶 +' + lootB + '%</span><span>🛡️ 減傷 ' + dmgR + '%</span>' +
    '</div>' +
    '<div class="statRow">' +
      '<span title="練習模式答對會掉，弱點題機率更高">🔹 強化石 ' + (D.rpg.enchantStone || 0) + '</span>' +
      '<span title="打怪勝利才會掉，怪物等級越高機率越高">🔮 突破結晶 ' + (D.rpg.breakStone || 0) + '</span>' +
    '</div>' +

    accSection('achievements', '成就徽章', badgeCount + ' / ' + ACHIEVEMENTS.length, achievementsHTML()) +

    accSection('subject', '分科屬性', '', 
      infoBox('科目讀得越熟（複習到「熟練」的題目占比），對應屬性星級越高，提供永久小額加成。') +
      '<div class="card">' + subjectAttrHTML() + '</div>') +

    accSection('equip', '裝備欄', equippedCount + ' / 9', dollHTML(), true) +

    accSection('shop', '商店', '',
      infoBox('稀有裝備（藍色以上）僅能從打怪掉落取得，點下方分類展開清單。') +
      shopSlotHTML('weapon','武器','🗡️') +
      shopSlotHTML('armor','防具','🛡️') +
      shopSlotHTML('helmet','頭盔','🪖') +
      shopSlotHTML('boots','鞋子','👢') +
      shopSlotHTML('accessory','飾品','💍')) +

    accSection('inv', '背包', D.rpg.inv.length + ' 件',
      (D.rpg.inv.length
        ? infoBox('用不到的裝備可以「分解」換金幣；強化、用素材強化與更換裝備請至上方「裝備欄」點選人物身上的部位操作。') + '<div class="card">' + D.rpg.inv.map(invRowHTML).join('') + '</div>'
        : '<p class="hint" style="margin:0 2px">還沒有任何裝備，打怪或到商店購買吧。</p>')) +

    accSection('challenge', '選擇挑戰', due ? due + ' 題待複習' : '',
      infoBox('答對造成傷害、答錯會被反擊；不論輸贏，作答紀錄與複習排程都會照常保存。遭遇的怪物強度隨機：普通／小怪機率較高，精英⭐與首領👑機率較低，但擊敗後經驗、金幣、掉寶稀有度與突破結晶🔮機率都更高（突破結晶用來突破裝備關卡，可取代消耗自己裝備當素材）。') +
      challengeCardsHTML(), true) +


    accSection('bosslog', '首領圖鑑', Object.keys(D.rpg.bossKills || {}).length + ' / ' + (EXAM_NAMES.length + 1),
      bossLogHTML());

  bindAdventureEvents();
  window.scrollTo(0,0);
}

function bonusLabel(cfg, stars){
  var v = stars * cfg.per;
  if (cfg.effect === 'atk') return '+' + v + ' 攻擊';
  if (cfg.effect === 'hp') return '+' + v + ' 生命';
  if (cfg.effect === 'goldPct') return '+' + v + '% 金幣';
  if (cfg.effect === 'xpPct') return '+' + v + '% 經驗';
  return '';
}
function subjectAttrHTML(){
  var rows = Object.keys(SUBJECT_ATTR).map(function(name){
    var cfg = SUBJECT_ATTR[name], m = subjectMastery(name);
    if (!m.total) return '';
    var stars = '★'.repeat(m.stars) + '☆'.repeat(5 - m.stars);
    return '<div class="attrRow"><span class="attrIcon">' + cfg.icon + '</span>' +
      '<span class="attrInfo"><span class="attrName">' + esc(name) + '・' + cfg.attr + '</span>' +
      '<span class="attrStars">' + stars + '</span></span>' +
      '<span class="attrBonus">' + bonusLabel(cfg, m.stars) + '</span></div>';
  }).join('');
  return rows || '<p class="hint" style="margin:0;padding:14px">匯入題目後，讀得越熟，這裡會顯示對應的屬性加成。</p>';
}

function avatarPickerHTML(){
  return '<div class="avatarGrid">' + AVATARS.map(function(a){
    var locked = D.rpg.level < a.unlockLv;
    var selected = D.rpg.avatar === a.icon;
    return '<button class="avatarOpt' + (selected ? ' sel' : '') + (locked ? ' locked' : '') + '"' +
      ' data-avatar="' + a.icon + '"' + (locked ? ' disabled' : '') + '>' +
      '<span class="avOptIcon">' + (locked ? '🔒' : a.icon) + '</span>' +
      '<span class="avOptName">' + (locked ? 'Lv.' + a.unlockLv : esc(a.name)) + '</span>' +
    '</button>';
  }).join('') + '</div>';
}

function achievementsHTML(){
  if (!Array.isArray(D.rpg.badges)) D.rpg.badges = [];
  var unlocked = D.rpg.badges.length, total = ACHIEVEMENTS.length;
  var rows = ACHIEVEMENTS.map(function(a){
    var got = D.rpg.badges.indexOf(a.id) >= 0;
    return '<div class="badgeRow' + (got ? '' : ' locked') + '">' +
      '<span class="badgeIcon">' + (got ? a.icon : '🔒') + '</span>' +
      '<span class="badgeInfo"><span class="badgeName">' + esc(a.name) + '</span>' +
      '<span class="badgeDesc">' + esc(a.desc) + '</span></span>' +
      (got ? '<span class="badgeGot">✓</span>' : '') +
    '</div>';
  }).join('');
  return '<p class="hint" style="margin:0 0 9px">已解鎖 ' + unlocked + ' / ' + total + '</p><div class="card">' + rows + '</div>';
}

var DOLL_SLOTS = [
  { key:'helmet',     dataSlot:'helmet',    idx:null, label:'頭盔',   icon:'🪖' },
  { key:'weapon1',    dataSlot:'weapon',    idx:0,    label:'武器一', icon:'🗡️' },
  { key:'weapon2',    dataSlot:'weapon',    idx:1,    label:'武器二', icon:'🗡️' },
  { key:'armor',      dataSlot:'armor',     idx:null, label:'防具',   icon:'🛡️' },
  { key:'accessory1', dataSlot:'accessory', idx:0,    label:'飾品一', icon:'💍' },
  { key:'accessory2', dataSlot:'accessory', idx:1,    label:'飾品二', icon:'💍' },
  { key:'boots',      dataSlot:'boots',     idx:null, label:'鞋子',   icon:'👢' },
  { key:'relic1',     dataSlot:'relic',     idx:0,    label:'首領遺物一', icon:'🏆', relic:true },
  { key:'relic2',     dataSlot:'relic',     idx:1,    label:'首領遺物二', icon:'🏆', relic:true },
];
function dollSlotByKey(key){
  var found = null;
  DOLL_SLOTS.forEach(function(s){ if (s.key === key) found = s; });
  return found;
}
function getEquippedId(dataSlot, idx){
  var v = D.rpg.equip[dataSlot];
  if (idx == null) return v || null;
  return (Array.isArray(v) && v[idx]) ? v[idx] : null;
}
function setEquippedId(dataSlot, idx, id){
  if (idx == null){ D.rpg.equip[dataSlot] = id; return; }
  if (!Array.isArray(D.rpg.equip[dataSlot])) D.rpg.equip[dataSlot] = [];
  D.rpg.equip[dataSlot][idx] = id;
}
function clearEquippedId(dataSlot, idx){
  if (idx == null){ D.rpg.equip[dataSlot] = null; return; }
  if (Array.isArray(D.rpg.equip[dataSlot])) D.rpg.equip[dataSlot][idx] = null;
}
function dollHTML(){
  var slotBtns = DOLL_SLOTS.map(function(s){
    var id = getEquippedId(s.dataSlot, s.idx), it = itemById(id);
    var filled = !!it, active = ADV_SLOT_OPEN === s.key;
    var lv = filled ? enchantLevel(id) : 0;
    var tierDot = (filled && lv) ? '<span class="dollTierDot" style="background:' + enchantTierFor(lv).color + '" title="' + enchantTierFor(lv).name + '（+' + lv + '）"></span>' : '';
    return '<button class="dollSlot' + (filled ? ' filled rarity-' + it.rarity : '') + (active ? ' active' : '') + '"' +
      ' data-doll="' + s.key + '" aria-label="' + s.label + '">' +
      (filled ? it.icon : '<span class="dollEmpty">' + s.icon + '</span>') + tierDot +
    '</button>';
  }).join('');
  var body = '<div class="dollWrap"><div class="dollBody">' + D.rpg.avatar + '</div>' + slotBtns + '</div>';
  var detail = ADV_SLOT_OPEN
    ? slotDetailHTML(ADV_SLOT_OPEN)
    : infoBox('點選人物身上的裝備位置，即可查看、強化或更換裝備。武器與飾品各有兩個欄位，首領遺物欄有兩格、只能放首領專屬裝備（其餘一般裝備不會佔用遺物欄，兩者互不影響）。邊框顏色代表裝備稀有度，右下角圓點顏色代表強化階段。');
  return body + detail;
}
function slotDetailHTML(key){
  var s = dollSlotByKey(key);
  if (!s) return '';
  var dataSlot = s.dataSlot, idx = s.idx;
  var id = getEquippedId(dataSlot, idx), it = itemById(id);
  var owned = D.rpg.inv.filter(function(iid){
    var i = itemById(iid);
    if (!i || isEquipped(iid)) return false;
    return s.relic ? !!i.bossExclusive : (i.slot === dataSlot);
  });
  var html = '<div class="dollDetail">';
  if (it){
    var lv = enchantLevel(id), maxed = lv >= ENCHANT_MAX, cost = enchantCost(it, id);
    var mats = materialsFor(dataSlot, id), fuseCost = Math.round(cost / 2);
    var needsBreak = BREAKTHROUGH_LEVELS.indexOf(lv) >= 0;
    var stones = D.rpg.enchantStone || 0, crystals = D.rpg.breakStone || 0;
    var noteHtml = '', actionsHtml;
    if (maxed){
      actionsHtml = '<span class="owned">已滿級</span>';
    } else if (needsBreak){
      var canBreak = mats.length >= 2 && D.rpg.gold >= cost;
      var canBreakCrystal = crystals >= 2 && D.rpg.gold >= cost;
      var curTier = enchantTierFor(lv), nextTier = enchantTierFor(lv + 1);
      noteHtml = '<div class="breakNote">🔒 已達【' + curTier.name + '】階段上限（+' + lv + '），需消耗 <b>2件</b> 同部位裝備、或 <b>2顆突破結晶</b>🔮 作為突破素材，才能突破至【' + nextTier.name + '】階段' +
        (mats.length < 2 ? '（目前有 ' + mats.length + ' 件可用裝備素材、' + crystals + ' 顆突破結晶）' : '') + '</div>';
      actionsHtml = '<button class="btn tiny break" data-breakthrough="' + id + '"' + (canBreak ? '' : ' disabled') + '>⚡ 裝備突破 💰' + cost + '</button>' +
        '<button class="btn tiny sec break" data-breakthrough-crystal="' + id + '"' + (canBreakCrystal ? '' : ' disabled') + '>🔮 結晶突破 💰' + cost + '</button>';
    } else {
      actionsHtml = '<button class="btn tiny" data-enchant="' + id + '"' + (D.rpg.gold < cost ? ' disabled' : '') + '>強化 💰' + cost + '</button>' +
        (mats.length ? '<button class="btn tiny sec fuse" data-fuse="' + id + '">🔧 素材強化 💰' + fuseCost + '</button>' : '') +
        '<button class="btn tiny sec stone" data-enchant-stone="' + id + '"' + (stones ? '' : ' disabled') + '>🔹 強化石強化（剩' + stones + '）</button>';
    }
    html += '<div class="itRow2 rarity-' + it.rarity + '">' +
      '<div class="itTop">' +
        '<span class="itIcon">' + it.icon + '</span>' +
        '<span class="itInfo"><span class="itName">' + esc(it.name) + enchBadge(lv) + (it.bossExclusive ? ' <span class="mythTag">首領專屬</span>' : '') + '</span>' +
        '<span class="itStat">' + statTextForInstance(it, id) + '</span></span>' +
        '<button class="btn sec tiny" data-doll-unequip="' + key + '">卸下</button>' +
      '</div>' +
      noteHtml +
      '<div class="itSub">' + actionsHtml + '</div>' +
    '</div>';
  } else {
    html += '<p class="hint" style="margin:0 0 9px">' + s.label + '尚未裝備任何物品。</p>';
  }
  if (owned.length){
    html += '<p class="hint" style="margin:2px 0 6px">更換' + s.label + '：</p><div class="card">' +
      owned.map(function(iid){
        var i = itemById(iid), l = enchantLevel(iid);
        return '<div class="itRow rarity-' + i.rarity + '">' +
          '<span class="itIcon">' + i.icon + '</span>' +
          '<span class="itInfo"><span class="itName">' + esc(i.name) + enchBadge(l) + (i.bossExclusive ? ' <span class="mythTag">首領專屬</span>' : '') + '</span>' +
          '<span class="itStat">' + statTextForInstance(i, iid) + '</span></span>' +
          '<button class="btn tiny sec" data-equip-to="' + key + '|' + iid + '">裝備</button>' +
        '</div>';
      }).join('') +
    '</div>';
  }
  html += '</div>';
  return html;
}

function shopRowHTML(it){
  var owned = D.rpg.inv.indexOf(it.id) >= 0;
  return '<div class="itRow rarity-' + it.rarity + '">' +
    '<span class="itIcon">' + it.icon + '</span>' +
    '<span class="itInfo"><span class="itName">' + esc(it.name) + '</span><span class="itStat">' + statText(it) + '</span></span>' +
    (owned ? '<span class="owned">已擁有</span>' : '<button class="btn tiny" data-buy="' + it.id + '">💰' + it.cost + '</button>') +
  '</div>';
}
function shopSlotHTML(slot, label, icon){
  var list = ITEMS.filter(function(i){ return i.slot === slot && !i.dropOnly; });
  var ownedCount = list.filter(function(i){ return D.rpg.inv.indexOf(i.id) >= 0; }).length;
  return accSection('shop-' + slot, icon + ' ' + label, ownedCount + ' / ' + list.length,
    '<div class="card">' + list.map(shopRowHTML).join('') + '</div>');
}

var RARITY_ORDER = { common:0, rare:1, epic:2, legendary:3, mythic:4 };
function materialsFor(slot, excludeId){
  return D.rpg.inv.filter(function(iid){
    if (iid === excludeId) return false;
    var it = itemById(iid);
    return it && it.slot === slot && !it.noSell && !isEquipped(iid);
  }).sort(function(a,b){ return RARITY_ORDER[itemById(a).rarity] - RARITY_ORDER[itemById(b).rarity]; });
}
function invRowHTML(id){
  var it = itemById(id); if (!it) return '';
  var equipped = isEquipped(id);
  var lv = enchantLevel(id);
  var sv = sellValue(it);
  return '<div class="itRow2 rarity-' + it.rarity + '">' +
    '<div class="itTop">' +
      '<span class="itIcon">' + it.icon + '</span>' +
      '<span class="itInfo"><span class="itName">' + esc(it.name) + enchBadge(lv) + (it.bossExclusive ? ' <span class="mythTag">首領專屬</span>' : '') + '</span>' +
      '<span class="itStat">' + statTextForInstance(it, id) + '</span></span>' +
      '<button class="btn tiny sec" data-equip="' + id + '"' + (equipped ? ' disabled' : '') + '>' + (equipped ? '已裝備' : '裝備') + '</button>' +
    '</div>' +
    '<div class="itSub">' +
      (it.noSell ? '<span class="owned">首領專屬裝備無法分解</span>' : '<button class="btn tiny sec warn" data-sell="' + id + '">分解 +' + sv + '💰</button>') +
    '</div>' +
  '</div>';
}

function bossLogHTML(){
  var order = EXAM_NAMES.concat(['review']);
  var kills = D.rpg.bossKills || {};
  var grid = order.map(function(key){
    var bt = BOSS_TITLES[key] || { title:key, icon:'👑' };
    var count = kills[key] || 0;
    var beaten = count > 0;
    var exclusive = ITEMS.filter(function(i){ return i.bossExclusive === key; })[0];
    var hasExclusive = exclusive && D.rpg.inv.indexOf(exclusive.id) >= 0;
    return '<div class="bossEntry' + (beaten ? ' beaten' : '') + '">' +
      '<span class="bossIcon">' + (beaten ? bt.icon : '<span class="dollEmpty">' + bt.icon + '</span>') + '</span>' +
      '<span class="bossName">' + esc(bt.title) + '</span>' +
      '<span class="bossCount">' + (beaten ? '擊敗 ' + count + ' 次' : '尚未擊敗') + '</span>' +
      (exclusive
        ? '<span class="bossExclusive' + (hasExclusive ? ' got' : '') + '">' +
            (hasExclusive ? exclusive.icon + ' 已獲得專屬裝備' : '🔒 未獲得「' + esc(exclusive.name) + '」') +
          '</span>'
        : '') +
    '</div>';
  }).join('');
  var log = (D.rpg.bossLog || []).slice(0, 8);
  var logHtml = log.length
    ? '<p class="hint" style="margin:12px 0 6px">最近擊殺紀錄：</p><div class="card">' + log.map(function(e){
        return '<div class="bossLogRow">' +
          '<span class="bossIcon">' + e.icon + '</span>' +
          '<span class="bossLogInfo"><span class="bossLogName">' + esc(e.name) + '</span>' +
          '<span class="bossLogMeta">' + e.date + '・+' + e.gold + '💰 +' + e.xp + '⭐' +
          (e.lootName ? '・掉落「' + esc(e.lootName) + '」' : '') + '</span></span>' +
        '</div>';
      }).join('') + '</div>'
    : '';
  return infoBox('每個考科（含錯題複習池）都有一位專屬首領，首次擊敗會固定掉落該科的專屬神器（紅框，加成遠高於一般裝備，但強化成本也更高，且無法分解）。專屬神器只能裝備在「首領遺物欄」（2格），不會佔用一般裝備欄位，但也因此就算集滿全部神器，同時間最多只能裝備2件，需要自行取捨。遭遇機率隨連勝提升。') +
    '<div class="bossGrid">' + grid + '</div>' + logHtml;
}
function challengeCardsHTML(){
  var due = BANK.filter(function(q){ return dueQ(q.id); });
  var streak = D.rpg.winStreak || 0;
  var html = streak > 0 ? '<p class="hint" style="margin:0 0 9px">目前連勝 <b>' + streak + '</b> 場，遇到精英／首領的機率已提高，且金幣有連勝加成，小心別輸掉！</p>' : '';
  html += '<div class="card chCard" data-battle="review"' + (due.length ? '' : ' style="opacity:.45"') + '>' +
    '<div class="chIcon">🧟</div><div class="chInfo"><div class="chName">錯題複習池</div>' +
    '<div class="hint">' + (due.length ? due.length + ' 題待複習，適合打怪順便複習' : '目前沒有到期的複習題') + '</div></div>' +
    (due.length ? '<button class="btn tiny">挑戰</button>' : '') + '</div>';

  EXAM_NAMES.forEach(function(name){
    var pool = BANK.filter(function(q){ return q.exam === name; });
    if (!pool.length) return;
    html += '<div class="card chCard" data-battle="exam" data-exam="' + esc(name) + '">' +
      '<div class="chIcon">' + examIcon(name) + '</div><div class="chInfo"><div class="chName">' + esc(name) + '</div>' +
      '<div class="hint">' + pool.length + ' 題可挑戰</div></div>' +
      '<button class="btn tiny">挑戰</button></div>';
  });
  return html;
}

function renderAdventureKeepScroll(){
  var y = window.scrollY;
  renderAdventure();
  window.scrollTo(0, y);
}
function bindAdventureEvents(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-acc]'), function(b){
    b.onclick = function(){
      var key = b.dataset.acc;
      var cur = ADV_OPEN.hasOwnProperty(key) ? ADV_OPEN[key] : false;
      ADV_OPEN[key] = !cur;
      renderAdventureKeepScroll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-buy]'), function(b){
    b.onclick = function(){
      var id = b.dataset.buy, it = itemById(id);
      if (!it || D.rpg.gold < it.cost || D.rpg.inv.indexOf(id) >= 0) return;
      D.rpg.gold -= it.cost; D.rpg.inv.push(id); save(); checkAchievements(); renderAdventureKeepScroll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-equip]'), function(b){
    b.onclick = function(){
      var id = b.dataset.equip, it = itemById(id);
      if (!it) return;
      if (it.bossExclusive){
        var rarr = D.rpg.equip.relic;
        if (!Array.isArray(rarr)) rarr = D.rpg.equip.relic = [];
        if (!rarr[0]) rarr[0] = id;
        else if (rarr.length < RELIC_SLOTS && !rarr[1]) rarr[1] = id;
        else rarr[0] = id; // 遺物欄都滿時，預設替換第一格
      } else if (it.slot === 'weapon' || it.slot === 'accessory'){
        var arr = D.rpg.equip[it.slot];
        if (!Array.isArray(arr)) arr = D.rpg.equip[it.slot] = [];
        if (!arr[0]) arr[0] = id;
        else if (!arr[1]) arr[1] = id;
        else arr[0] = id; // 兩格都滿時，預設替換第一格
      } else {
        D.rpg.equip[it.slot] = id;
      }
      save(); renderAdventureKeepScroll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-equip-to]'), function(b){
    b.onclick = function(){
      var parts = b.dataset.equipTo.split('|'), key = parts[0], id = parts[1];
      var s = dollSlotByKey(key), it = itemById(id);
      if (!s || !it) return;
      setEquippedId(s.dataSlot, s.idx, id);
      save(); renderAdventureKeepScroll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-unequip]'), function(b){
    b.onclick = function(){ D.rpg.equip[b.dataset.unequip] = null; save(); renderAdventureKeepScroll(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-doll]'), function(b){
    b.onclick = function(){
      var key = b.dataset.doll;
      ADV_SLOT_OPEN = (ADV_SLOT_OPEN === key) ? null : key;
      renderAdventureKeepScroll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-doll-unequip]'), function(b){
    b.onclick = function(){
      var s = dollSlotByKey(b.dataset.dollUnequip);
      if (!s) return;
      clearEquippedId(s.dataSlot, s.idx);
      save(); renderAdventureKeepScroll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-enchant]'), function(b){
    b.onclick = function(){
      var id = b.dataset.enchant, it = itemById(id);
      if (!it) return;
      var lv = enchantLevel(id);
      if (lv >= ENCHANT_MAX) return;
      if (BREAKTHROUGH_LEVELS.indexOf(lv) >= 0) return;
      var cost = enchantCost(it, id);
      if (D.rpg.gold < cost) return;
      D.rpg.gold -= cost;
      if (!D.rpg.enchant) D.rpg.enchant = {};
      D.rpg.enchant[id] = lv + 1;
      save(); checkAchievements(); renderAdventureKeepScroll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-enchant-stone]'), function(b){
    b.onclick = function(){
      var id = b.dataset.enchantStone, it = itemById(id);
      if (!it) return;
      var lv = enchantLevel(id);
      if (lv >= ENCHANT_MAX) return;
      if (BREAKTHROUGH_LEVELS.indexOf(lv) >= 0) return;
      if ((D.rpg.enchantStone || 0) < 1) return;
      D.rpg.enchantStone -= 1;
      if (!D.rpg.enchant) D.rpg.enchant = {};
      D.rpg.enchant[id] = lv + 1;
      save(); checkAchievements(); renderAdventureKeepScroll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-sell]'), function(b){
    b.onclick = function(){
      var id = b.dataset.sell, it = itemById(id);
      if (!it || it.noSell) return;
      var lv = enchantLevel(id);
      var sv = sellValue(it);
      var msg = '確定要分解「' + it.name + (lv ? ' +' + lv : '') + '」嗎？' +
        (lv ? '強化等級將一併消失，' : '') + '可換回 ' + sv + ' 金幣。';
      if (!confirm(msg)) return;
      Object.keys(D.rpg.equip).forEach(function(slot){
        var v = D.rpg.equip[slot];
        if (Array.isArray(v)){ var idx2 = v.indexOf(id); if (idx2 >= 0) v[idx2] = null; }
        else if (v === id) D.rpg.equip[slot] = null;
      });
      var idx = D.rpg.inv.indexOf(id);
      if (idx >= 0) D.rpg.inv.splice(idx, 1);
      if (D.rpg.enchant && D.rpg.enchant[id] != null) delete D.rpg.enchant[id];
      D.rpg.gold += sv;
      save(); renderAdventureKeepScroll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-fuse]'), function(b){
    b.onclick = function(){
      var id = b.dataset.fuse, it = itemById(id);
      if (!it) return;
      var lv = enchantLevel(id);
      if (lv >= ENCHANT_MAX) return;
      if (BREAKTHROUGH_LEVELS.indexOf(lv) >= 0) return;
      var mats = materialsFor(it.slot, id);
      if (!mats.length) return;
      var matId = mats[0], matIt = itemById(matId);
      var cost = enchantCost(it, id), fuseCost = Math.round(cost / 2);
      if (D.rpg.gold < fuseCost) return;
      var msg = '用「' + matIt.name + '」當強化素材（將會消失），並花費 ' + fuseCost +
        ' 金幣，把「' + it.name + '」強化到 +' + (lv + 1) + '？';
      if (!confirm(msg)) return;
      var idx = D.rpg.inv.indexOf(matId);
      if (idx >= 0) D.rpg.inv.splice(idx, 1);
      if (D.rpg.enchant && D.rpg.enchant[matId] != null) delete D.rpg.enchant[matId];
      D.rpg.gold -= fuseCost;
      if (!D.rpg.enchant) D.rpg.enchant = {};
      D.rpg.enchant[id] = lv + 1;
      save(); checkAchievements(); renderAdventureKeepScroll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-breakthrough]'), function(b){
    b.onclick = function(){
      var id = b.dataset.breakthrough, it = itemById(id);
      if (!it) return;
      var lv = enchantLevel(id);
      if (BREAKTHROUGH_LEVELS.indexOf(lv) < 0) return;
      var mats = materialsFor(it.slot, id);
      if (mats.length < 2) return;
      var cost = enchantCost(it, id);
      if (D.rpg.gold < cost) return;
      var used = mats.slice(0, 2);
      var usedNames = used.map(function(mid){ return itemById(mid).name; }).join('、');
      var msg = '突破需要消耗「' + usedNames + '」這2件同部位裝備（將會消失），並花費 ' + cost +
        ' 金幣，把「' + it.name + '」突破強化到 +' + (lv + 1) + '？';
      if (!confirm(msg)) return;
      D.rpg.inv = D.rpg.inv.filter(function(iid){ return used.indexOf(iid) < 0; });
      used.forEach(function(mid){ if (D.rpg.enchant && D.rpg.enchant[mid] != null) delete D.rpg.enchant[mid]; });
      D.rpg.gold -= cost;
      if (!D.rpg.enchant) D.rpg.enchant = {};
      D.rpg.enchant[id] = lv + 1;
      save(); checkAchievements(); renderAdventureKeepScroll();
      var newTier = enchantTierFor(lv + 1);
      setTimeout(function(){
        alert('⚡ 突破成功！\n「' + it.name + '」躍升至【' + newTier.name + '】階段（+' + (lv + 1) + '）！');
      }, 50);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-breakthrough-crystal]'), function(b){
    b.onclick = function(){
      var id = b.dataset.breakthroughCrystal, it = itemById(id);
      if (!it) return;
      var lv = enchantLevel(id);
      if (BREAKTHROUGH_LEVELS.indexOf(lv) < 0) return;
      if ((D.rpg.breakStone || 0) < 2) return;
      var cost = enchantCost(it, id);
      if (D.rpg.gold < cost) return;
      var msg = '突破需要消耗 <b>2顆突破結晶</b>🔮，並花費 ' + cost +
        ' 金幣，把「' + it.name + '」突破強化到 +' + (lv + 1) + '？';
      if (!confirm(msg.replace(/<\/?b>/g,''))) return;
      D.rpg.breakStone -= 2;
      D.rpg.gold -= cost;
      if (!D.rpg.enchant) D.rpg.enchant = {};
      D.rpg.enchant[id] = lv + 1;
      save(); checkAchievements(); renderAdventureKeepScroll();
      var newTier = enchantTierFor(lv + 1);
      setTimeout(function(){
        alert('⚡ 突破成功！\n「' + it.name + '」躍升至【' + newTier.name + '】階段（+' + (lv + 1) + '）！');
      }, 50);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-avatar]'), function(b){
    if (b.disabled) return;
    b.onclick = function(){
      D.rpg.avatar = b.dataset.avatar; SHOW_AVATAR_PICKER = false; save(); renderAdventureKeepScroll();
    };
  });
  var ab = $('#avatarBtn');
  if (ab) ab.onclick = function(){ SHOW_AVATAR_PICKER = !SHOW_AVATAR_PICKER; renderAdventureKeepScroll(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-battle]'), function(card){
    card.onclick = function(){
      if (card.dataset.battle === 'review'){
        var due = BANK.filter(function(q){ return dueQ(q.id); });
        if (!due.length) return;
        startBattle(due, 'review', '複習');
      } else {
        var name = card.dataset.exam;
        var pool = BANK.filter(function(q){ return q.exam === name; });
        if (!pool.length) return;
        startBattle(pool, 'exam', name);
      }
    };
  });
}

/* ===================== 冒險：戰鬥 ===================== */
var MONSTER_TIERS = [
  { key:'weak',   label:'小怪',   weight:46, hpMult:0.65, atkMult:0.75, goldMult:0.75, xpMult:0.8,  tagIcon:'',   tagClass:'' },
  { key:'normal', label:'普通怪', weight:34, hpMult:1.0,  atkMult:1.0,  goldMult:1.0,  xpMult:1.0,  tagIcon:'',   tagClass:'' },
  { key:'elite',  label:'精英怪', weight:15, hpMult:1.6,  atkMult:1.3,  goldMult:1.5,  xpMult:1.4,  tagIcon:'⭐', tagClass:'tier-elite' },
  { key:'boss',   label:'首領',   weight:5,  hpMult:2.4,  atkMult:1.6,  goldMult:2.2,  xpMult:2.0,  tagIcon:'👑', tagClass:'tier-boss' },
];
var BOSS_TITLES = {
  '國文':                 { title:'文膽巨靈',   icon:'📜' },
  '綜合法政知識':          { title:'法典守衛者', icon:'⚖️' },
  '外國文':                { title:'譯語魔王',   icon:'🌐' },
  '國際公法':              { title:'公法巨像',   icon:'🏛️' },
  '國際關係與近代外交史':   { title:'史河幽靈',   icon:'🕰️' },
  '國際經濟':              { title:'匯率魔神',   icon:'💱' },
  'review':               { title:'遺忘輪迴之影', icon:'🌀' }
};
function pickMonsterTier(streak){
  streak = streak || 0;
  var bonus = Math.min(30, streak * 3); // 連勝加成：每連勝+3%，最高+30%
  var tiers = MONSTER_TIERS.map(function(t){ return Object.assign({}, t); });
  var weak = tiers[0], elite = tiers[2], boss = tiers[3];
  var take = Math.min(Math.max(0, weak.weight - 5), bonus);
  weak.weight -= take;
  elite.weight += take * 0.7;
  boss.weight += take * 0.3;
  var total = tiers.reduce(function(s,t){ return s + t.weight; }, 0);
  var r = Math.random() * total, acc = 0;
  for (var i = 0; i < tiers.length; i++){
    acc += tiers[i].weight;
    if (r < acc) return tiers[i];
  }
  return tiers[0];
}
var TIER_LOOT_WEIGHTS = {
  weak:   { none:0.65, common:0.28, rare:0.06, epic:0.01, legendary:0.00 },
  normal: { none:0.50, common:0.30, rare:0.14, epic:0.05, legendary:0.01 },
  elite:  { none:0.30, common:0.24, rare:0.28, epic:0.14, legendary:0.04 },
  boss:   { none:0.05, common:0.10, rare:0.30, epic:0.35, legendary:0.20 },
};
function rollLootForTier(tierKey){
  var w = Object.assign({}, TIER_LOOT_WEIGHTS[tierKey] || TIER_LOOT_WEIGHTS.normal);
  var bonus = Math.min(0.9, rpgLootBonus() / 100);
  var shift = Math.min(w.none, bonus * 0.5);
  w.none -= shift;
  var rest = w.common + w.rare + w.epic + w.legendary;
  if (rest > 0 && shift > 0){
    w.common += shift * (w.common / rest);
    w.rare += shift * (w.rare / rest);
    w.epic += shift * (w.epic / rest);
    w.legendary += shift * (w.legendary / rest);
  }
  var order = ['none','common','rare','epic','legendary'], r = Math.random(), acc = 0, rarity = null;
  for (var i = 0; i < order.length; i++){
    acc += w[order[i]];
    if (r < acc){ rarity = order[i]; break; }
  }
  if (!rarity || rarity === 'none') return null;
  var pool = ITEMS.filter(function(i){ return i.rarity === rarity; });
  if (!pool.length) return null;
  var unowned = pool.filter(function(i){ return D.rpg.inv.indexOf(i.id) < 0; });
  var pick = unowned.length ? unowned : pool;
  return pick[Math.floor(Math.random() * pick.length)];
}
function monsterFor(kind, label, n){
  var tier = pickMonsterTier(D.rpg.winStreak || 0);
  var baseHp = Math.max(30, n * 12);
  var hp = Math.max(20, Math.round(baseHp * tier.hpMult));
  var baseAtk = 4 + Math.floor(D.rpg.level/2) + Math.floor(Math.random()*3);
  var atk = Math.max(1, Math.round(baseAtk * tier.atkMult));
  var bossKey = kind === 'review' ? 'review' : label;
  var icon, name;
  if (tier.key === 'boss'){
    var bt = BOSS_TITLES[bossKey] || { title:label + '首領', icon:'👑' };
    icon = bt.icon; name = bt.title;
  } else {
    icon = MONSTER_ICONS[Math.floor(Math.random() * MONSTER_ICONS.length)];
    name = (kind === 'review' ? '遺忘史萊姆' : label + '魔像');
    if (tier.key === 'elite') name = tier.label + '・' + name;
  }
  return { name:name, icon:icon, hp:hp, maxHp:hp, atk:atk,
    tier:tier.key, tierLabel:tier.label, tagIcon:tier.tagIcon, tagClass:tier.tagClass,
    goldMult:tier.goldMult, xpMult:tier.xpMult, bossKey: tier.key === 'boss' ? bossKey : null };
}

function startBattle(list, kind, label){
  if (!list.length) return;
  var queue = list.map(function(q){ return q.id; });
  queue.sort(function(){ return Math.random() - .5; });
  queue = queue.slice(0, Math.min(20, queue.length));
  var maxHp = rpgMaxHp();
  S = {
    mode:'battle', label:label,
    monster: monsterFor(kind, label, queue.length),
    queue:queue, qIndex:0,
    id:null, pick:null, cut:[], unsure:false, graded:false,
    playerHp:maxHp, playerMaxHp:maxHp,
    n:0, right:0, ms:0, qStart:0, combo:0,
    lastReward:null, lastDmg:0, lastTaken:0
  };
  nextBattleQ();
}

function nextBattleQ(){
  if (S.qIndex >= S.queue.length){ endBattle(S.monster.hp <= 0 ? 'victory' : 'draw'); return; }
  S.id = S.queue[S.qIndex++]; S.pick = null; S.cut = []; S.unsure = false; S.graded = false; S.qStart = Date.now();
  renderBattle();
}

function renderBattle(){
  var q = BANK.filter(function(x){ return x.id === S.id; })[0];
  if (!q){ endBattle('draw'); return; }
  var lg = q.legal || {}, ok = S.graded && S.pick === q.answer, m = S.monster;

  $('#s-adventure').innerHTML =
    '<div class="battleTop">' +
      '<button class="x" id="flee" aria-label="逃跑並儲存進度">✕</button>' +
      '<span class="mid">' + esc(S.label) + '　第 ' + S.qIndex + ' / ' + S.queue.length + ' 題</span>' +
      '<span class="clk" id="clk">00:00</span>' +
    '</div>' +
    '<div class="hpCard' + (m.tagClass ? ' ' + m.tagClass : '') + '">' +
      '<div class="hpRow"><span class="hpIcon">' + m.icon + '</span><span class="hpName">' + esc(m.name) + (m.tagIcon ? ' <span class="tierTag ' + m.tagClass + '">' + m.tagIcon + esc(m.tierLabel) + '</span>' : '') + '</span>' +
        '<span class="hpNum">' + Math.max(0,m.hp) + ' / ' + m.maxHp + '</span></div>' +
      '<div class="hpBar"><i style="width:' + Math.max(0, m.hp/m.maxHp*100) + '%"></i></div>' +
      '<div class="hpRow me"><span class="hpIcon">🧙</span><span class="hpName">你</span>' +
        '<span class="hpNum">' + Math.max(0,S.playerHp) + ' / ' + S.playerMaxHp + '</span></div>' +
      '<div class="hpBar me"><i style="width:' + Math.max(0, S.playerHp/S.playerMaxHp*100) + '%"></i></div>' +
    '</div>' +
    '<div class="q">' +
      '<div class="meta">' +
        lineage(q).map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') +
        (lg.flagged ? '<span class="law">⚠ 法規時效</span>' : '') +
      '</div>' +
      passageHTML(q) + '<p class="stem">' + esc(q.stem) + '</p>' +
      (S.graded ? '' : '<p class="tip">點選項即出招；答對造成傷害，答錯會被反擊。</p>') +
      '<div class="opts" id="opts">' + optsHTML(q, ok) + '</div>' +
      (S.graded ? '' :
        '<button class="unsure" id="uns" aria-pressed="' + S.unsure + '">' +
          '<span class="bx">✓</span><span>我不太確定 — 答對也排進複習</span></button>') +
      (S.graded ? verdictHTML(q, ok) + battleFxHTML(ok) + solHTML(q) : '') +
    '</div>' +
    (S.graded ? '<button class="btn" id="nx">' +
      (S.qIndex >= S.queue.length || m.hp <= 0 || S.playerHp <= 0 ? '查看結果' : '下一題') + '</button>' : '');

  bindOpts(q);
  var u = $('#uns'); if (u) u.onclick = function(){ S.unsure = !S.unsure; var y = window.scrollY; renderBattle(); window.scrollTo(0, y); };
  $('#flee').onclick = function(){
    if (confirm('離開戰鬥？已賺到的金幣經驗會保留，怪物會逃走。')){ stopClock(); S = null; renderAdventure(); }
  };
  var nx = $('#nx');
  if (nx) nx.onclick = function(){
    if (m.hp <= 0) endBattle('victory');
    else if (S.playerHp <= 0) endBattle('defeat');
    else nextBattleQ();
  };
  S.graded ? stopClock() : startClock();
  window.scrollTo(0,0);
}

function battleFxHTML(ok){
  var rw = S.lastReward, tag = rw ? (' <span class="rw">+' + rw.gold + '💰 +' + rw.xp + '⭐' + (rw.leveled ? ' 🎉升級！' : '') + '</span>') : '';
  if (ok) return '<div class="fx ok">⚔️ 造成 ' + S.lastDmg + ' 點傷害！' + tag + '</div>';
  return '<div class="fx no">💥 被反擊，損失 ' + S.lastTaken + ' 點HP' + tag + '</div>';
}

function battleGrade(q){
  var spent = Date.now() - S.qStart;
  var ok = S.pick === q.answer;
  var p = P(q.id);
  p.seen++; p.ms += spent; p.at = Date.now();
  if (ok) p.right++; else p.wrong++;
  if (S.unsure) p.unsure++;
  if (!ok) p.lv = Math.max(0, p.lv - 1);
  else if (S.unsure) p.lv = Math.max(1, p.lv);
  else p.lv = Math.min(MAX_LV, p.lv + 1);
  p.due = Date.now() + ((!ok || S.unsure) ? 1 : INTERVALS[p.lv]) * DAY;
  if (D.days.indexOf(today()) < 0) D.days.push(today());

  S.lastReward = rpgAward(ok, S.unsure);

  if (ok){
    S.lastDmg = rpgAtk() + Math.floor(Math.random()*4);
    S.monster.hp = Math.max(0, S.monster.hp - S.lastDmg);
    S.lastTaken = 0;
  } else {
    var rawDmg = Math.max(1, S.monster.atk + Math.floor(Math.random()*3) - 2);
    S.lastTaken = Math.max(1, Math.round(rawDmg * (1 - rpgDmgReduction()/100)));
    S.playerHp = Math.max(0, S.playerHp - S.lastTaken);
    S.lastDmg = 0;
  }

  S.graded = true; S.lastMs = spent; S.n++; if (ok) S.right++; S.ms += spent;
  if (ok){ S.combo = (S.combo||0) + 1; if (S.combo > (D.rpg.bestCombo||0)) D.rpg.bestCombo = S.combo; }
  else { S.combo = 0; }
  save(); refreshBadge(); checkAchievements(); renderBattle();
}

function endBattle(result){
  stopClock();
  var m = S.monster, n = S.n, right = S.right, ms = S.ms;
  var bonusGold, bonusXp, loot = null, streakBonusGold = 0, breakStone = 0;
  if (result === 'victory'){
    bonusGold = Math.round((15 + Math.round(m.maxHp/3)) * (m.goldMult || 1));
    bonusXp = Math.round((10 + Math.round(m.maxHp/4)) * (m.xpMult || 1));
    loot = rollLootForTier(m.tier);
    breakStone = rollBreakStone(m.tier);
    if (breakStone) D.rpg.breakStone = (D.rpg.breakStone || 0) + breakStone;
    D.rpg.wins = (D.rpg.wins || 0) + 1;
    D.rpg.winStreak = (D.rpg.winStreak || 0) + 1;
    if (D.rpg.winStreak > (D.rpg.bestWinStreak || 0)) D.rpg.bestWinStreak = D.rpg.winStreak;
    streakBonusGold = Math.round(bonusGold * Math.min(0.3, (D.rpg.winStreak - 1) * 0.03));
    bonusGold += streakBonusGold;
    if (m.tier === 'boss' && m.bossKey){
      D.rpg.bossKills = D.rpg.bossKills || {};
      D.rpg.bossKills[m.bossKey] = (D.rpg.bossKills[m.bossKey] || 0) + 1;
      var exclusive = ITEMS.filter(function(i){ return i.bossExclusive === m.bossKey; })[0];
      if (exclusive && D.rpg.inv.indexOf(exclusive.id) < 0){
        loot = exclusive; // 首領固定掉落其專屬裝備，直到玩家取得為止
      }
      D.rpg.bossLog = D.rpg.bossLog || [];
      D.rpg.bossLog.unshift({
        key:m.bossKey, name:m.name, icon:m.icon, date:today(),
        gold:bonusGold, xp:bonusXp,
        lootName: loot ? loot.name : null, lootRarity: loot ? loot.rarity : null
      });
      D.rpg.bossLog = D.rpg.bossLog.slice(0, 20);
    }
  } else if (result === 'draw'){
    bonusGold = 5; bonusXp = 5; D.rpg.winStreak = 0;
  } else {
    bonusGold = 2; bonusXp = 3; D.rpg.winStreak = 0;
  }
  D.rpg.gold += bonusGold;
  D.rpg.lifetimeGold = (D.rpg.lifetimeGold || 0) + bonusGold;
  var leveled = addXp(bonusXp);
  if (loot && D.rpg.inv.indexOf(loot.id) < 0) D.rpg.inv.push(loot.id);
  save(); refreshBadge();
  S = null;
  checkAchievements();
  renderBattleResult(result, m, n, right, ms, bonusGold, bonusXp, loot, leveled, streakBonusGold, breakStone);
}

function renderBattleResult(result, m, n, right, ms, bonusGold, bonusXp, loot, leveled, streakBonusGold, breakStone){
  var title = result === 'victory' ? ('擊敗了' + (m.tagIcon ? m.tagIcon + ' ' : '') + '「' + esc(m.name) + '」！') : (result === 'draw' ? '怪物逃走了' : '你撤退了');
  var icon = result === 'victory' ? '🏆' : (result === 'draw' ? '💨' : '🏳️');
  $('#s-adventure').innerHTML =
    '<div class="score">' +
      '<div style="font-size:44px">' + icon + '</div>' +
      '<div class="c" style="font-size:19px;font-weight:700;margin-top:6px">' + title + '</div>' +
      '<div class="m">本次作答 ' + n + ' 題・答對 ' + right + ' 題・耗時 ' + secs(ms) + '</div>' +
      '<div class="m" style="margin-top:8px">獲得 +' + bonusGold + '💰　+' + bonusXp + '⭐' + (leveled ? '　🎉升級！' : '') + '</div>' +
      (result === 'victory' && D.rpg.winStreak > 1 ? '<div class="m">🔥 連勝 ' + D.rpg.winStreak + ' 場' + (streakBonusGold ? '（連勝加成 +' + streakBonusGold + '💰）' : '') + '</div>' : '') +
      (result !== 'victory' ? '<div class="hint" style="margin-top:4px">連勝紀錄已中斷，下次再挑戰吧。</div>' : '') +
      (loot ? '<div class="lootBox rarity-' + loot.rarity + '"><span class="itIcon">' + loot.icon + '</span>掉落「' + esc(loot.name) + '」' + (statText(loot) ? '　' + statText(loot) : '') + '</div>' : '') +
      (breakStone ? '<div class="lootBox crystalBox">🔮 獲得 ' + breakStone + ' 顆突破結晶</div>' : '') +
    '</div>' +
    '<button class="btn" id="back">返回冒險</button>';
  $('#back').onclick = function(){ renderAdventure(); };
  window.scrollTo(0,0);
}

/* ===================== 分頁 ===================== */
function go(tab){
  Array.prototype.forEach.call(document.querySelectorAll('.screen'), function(s){ s.classList.remove('on'); });
  $('#s-' + tab).classList.add('on');
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
    b.setAttribute('aria-pressed', b.dataset.tab === tab); });
  if (tab === 'drill')  renderDrill();
  if (tab === 'review') renderReview();
  if (tab === 'stats')  renderStats();
  if (tab === 'bank')   renderBank();
  if (tab === 'adventure') renderAdventure();
  window.scrollTo(0,0);
}
Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
  b.onclick = function(){ go(b.dataset.tab); };
});
$('#themeBtn').onclick = cycleTheme;

/* ===================== 啟動 ===================== */
(async function init(){
  try {
    var saved = await Store.get();
    var savedBank = await Store.getBank();
    if (saved){
      D.progress = saved.progress || {};
      D.days = saved.days || [];
      D.settings = Object.assign({}, DEF_SET, saved.settings || {});
      // 題庫優先從獨立的 bank 儲存位置讀取；若是舊版資料（題庫還存在同一包裡），
      // 就沿用舊資料一次，並立刻搬到新的獨立位置，之後就不用再每次都存一份題庫了
      if (savedBank && savedBank.length){
        BANK = normalizeAll(savedBank);
      } else if (saved.bank && saved.bank.length){
        BANK = normalizeAll(saved.bank);
        saveBank();
      } else {
        BANK = normalizeAll(SEED.slice());
        saveBank();
      }
      if (!Array.isArray(D.settings.subjects)) D.settings.subjects = [];
      if (!Array.isArray(D.settings.parts)) D.settings.parts = [];
      // 舊版存的科目名稱轉為新的考科名稱
      D.settings.subjects = uniq(D.settings.subjects.map(function(s){
        return LEGACY[s] ? LEGACY[s][0] : s; })).filter(function(s){ return EXAM_NAMES.indexOf(s) >= 0; });
      D.rpg = Object.assign({}, DEF_RPG, saved.rpg || {});
      D.rpg.equip = migrateEquip(Object.assign({}, DEF_RPG.equip, (saved.rpg && saved.rpg.equip) || {}));
      D.rpg.enchant = Object.assign({}, (saved.rpg && saved.rpg.enchant) || {});
      D.rpg.bossKills = Object.assign({}, (saved.rpg && saved.rpg.bossKills) || {});
      D.rpg.bossLog = (saved.rpg && Array.isArray(saved.rpg.bossLog)) ? saved.rpg.bossLog.slice() : [];
      if (!Array.isArray(D.rpg.inv)) D.rpg.inv = [];
      D.rpg.badges = (saved.rpg && Array.isArray(saved.rpg.badges)) ? saved.rpg.badges.slice() : [];
    } else {
      D.settings = Object.assign({}, DEF_SET);
      BANK = normalizeAll((savedBank && savedBank.length) ? savedBank : SEED.slice());
      if (!savedBank || !savedBank.length) saveBank();
      D.rpg = Object.assign({}, DEF_RPG, { equip: { weapon:[], armor:null, helmet:null, boots:null, accessory:[], relic:[] }, enchant:{}, inv:[], badges:[], bossKills:{}, bossLog:[] });
    }
    save();
    applyTheme(D.settings.theme || 'auto');
    renderDrill();
    refreshBadge();
    checkAchievements();
  } catch(err){
    window.onerror('啟動失敗：' + err.message, '', 0);
  }
})();
</script>
