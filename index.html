<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="外特刷題">
<meta name="theme-color" content="#FAFAF8">
<title>外特刷題</title>
<style>
:root{
  --bg:#FAFAF8;
  --card:#FFFFFF;
  --line:#E5E3DD;
  --line-2:#F0EEE9;
  --tx:#17181C;
  --tx-2:#6B7078;
  --tx-3:#9A9EA6;
  --brand:#2C4A7C;
  --brand-soft:#EDF1F8;
  --ok:#0F7A57;
  --ok-soft:#E8F4EF;
  --no:#C0392B;
  --no-soft:#FBEDEB;
  --warn:#9A6B12;
  --warn-soft:#FBF3E2;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Hiragino Sans",system-ui,-apple-system,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#131417; --card:#1C1E22; --line:#2E3138; --line-2:#25272C;
    --tx:#EDEDEA; --tx-2:#9BA1AA; --tx-3:#6E747D;
    --brand:#7FA5DC; --brand-soft:#20293A;
    --ok:#4FC79B; --ok-soft:#16302A;
    --no:#F08578; --no-soft:#33201E;
    --warn:#E0B45C; --warn-soft:#332A18;
  }
}
:root[data-theme="dark"]{
  --bg:#131417; --card:#1C1E22; --line:#2E3138; --line-2:#25272C;
  --tx:#EDEDEA; --tx-2:#9BA1AA; --tx-3:#6E747D;
  --brand:#7FA5DC; --brand-soft:#20293A;
  --ok:#4FC79B; --ok-soft:#16302A;
  --no:#F08578; --no-soft:#33201E;
  --warn:#E0B45C; --warn-soft:#332A18;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--tx);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
input,textarea,select{font-size:16px;font-family:inherit}

#app{min-height:100dvh;padding-top:env(safe-area-inset-top)}
.screen{display:none;padding:0 16px 110px}
.screen.on{display:block}

/* ---- 標頭 ---- */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 16px 12px;
}
.top h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.04em}
.top .r{font-size:13px;color:var(--tx-2)}
.top .side{display:flex;align-items:center;gap:10px}
.themeBtn{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);border-radius:999px;
  padding:6px 12px 6px 10px;font-size:13px;color:var(--tx-2);
  background:var(--card);
}
.themeBtn .ic{font-size:15px;line-height:1}

/* ---- 區塊標題 ---- */
h2.sec{
  font-size:13px;font-weight:600;color:var(--tx-2);
  margin:26px 0 9px;letter-spacing:.06em;
}
h2.sec:first-child{margin-top:14px}

/* ---- 手風琴清單（冒險頁） ---- */
.accSection{margin-top:12px}
.accSection:first-child{margin-top:16px}
.accHead{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:14px 15px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);
}
.accHead[aria-expanded="true"]{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent}
.accTitle{font-size:14.5px;font-weight:700;color:var(--tx)}
.accSub{font-family:var(--num);font-size:12px;color:var(--tx-2);margin-left:auto}
.accChevron{font-size:12px;color:var(--tx-3);flex:none;width:14px;text-align:center}
.accBody{
  background:var(--card);border:1px solid var(--line);border-top:none;
  border-radius:0 0 var(--r) var(--r);padding:13px 15px 15px;
}
.accBody .card{border-radius:var(--r)}
.accBody > .card:first-child{margin-top:0}


/* ---- 卡片 ---- */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;
}
.card + .card{margin-top:10px}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 15px;
}
.row + .row{border-top:1px solid var(--line-2)}
.row .lab{font-size:16px;font-weight:500}
.row .hint{font-size:13px;color:var(--tx-2);margin-top:3px;line-height:1.5}
.row .btn{display:inline-block;width:auto;flex:none;margin-top:0;padding:9px 13px;font-size:13px;border-radius:8px;white-space:nowrap}
.pad{padding:15px}

/* ---- 分段控制 ---- */
.seg{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:11px}
.seg button{
  flex:1;text-align:center;padding:10px 6px;border-radius:8px;
  font-size:15px;color:var(--tx-2);font-weight:500;
}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.09)}

/* ---- 標籤 ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:9px 14px;font-size:15px;color:var(--tx-2);
}
.chip .n{font-family:var(--num);font-size:12px;opacity:.65;margin-left:5px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]):not([data-theme="dark"]) .chip[aria-pressed="true"]{color:#101318} }
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#101318}

/* ---- 開關 ---- */
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);flex:none;position:relative;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
.sw[aria-pressed="true"]{background:var(--ok)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}

.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.step button{width:42px;height:38px;text-align:center;font-size:20px;color:var(--brand);line-height:36px}
.step .v{font-family:var(--num);font-size:16px;min-width:42px;text-align:center}

/* ---- 按鈕 ---- */
.btn{
  display:block;width:100%;text-align:center;padding:16px;
  background:var(--brand);color:#fff;border-radius:12px;
  font-size:17px;font-weight:600;margin-top:14px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]):not([data-theme="dark"]) .btn{color:#101318} }
:root[data-theme="dark"] .btn{color:#101318}
.btn:disabled{background:var(--line);color:var(--tx-3)}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--tx);font-weight:500}
.btn.tiny{padding:13px;font-size:15px}

.empty{text-align:center;padding:56px 22px;color:var(--tx-2);font-size:15px;line-height:1.85}
.empty b{display:block;font-size:18px;color:var(--tx);margin-bottom:10px;font-weight:600}

/* ---- 底部導覽 ---- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs button{flex:1;text-align:center;padding:10px 0 8px;color:var(--tx-3);font-size:12px}
.tabs .ic{display:block;font-size:20px;line-height:1.25}
.tabs button[aria-pressed="true"]{color:var(--brand)}
.tabs .badge{
  display:inline-block;min-width:17px;padding:0 4px;height:17px;line-height:17px;
  background:var(--no);color:#fff;border-radius:9px;
  font-family:var(--num);font-size:10.5px;text-align:center;
  position:relative;top:-8px;left:2px;
}

/* ================= 作答 ================= */
.qtop{
  display:flex;align-items:center;gap:12px;padding:14px 0 12px;
}
.qtop .x{font-size:26px;color:var(--tx-2);line-height:1;width:28px;flex:none}
.qtop .mid{flex:1;font-size:13.5px;color:var(--tx-2)}
.qtop .clk{font-family:var(--num);font-size:14px;color:var(--tx-2);flex:none}
.qtop .clk.warn{color:var(--no);font-weight:600}
.prog{height:4px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}

.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px}

.miniMon{
  display:flex;align-items:center;gap:10px;
  margin:-18px -16px 14px;padding:11px 16px;
  background:var(--line-2);color:var(--tx-2);
  font-size:13.5px;font-weight:600;border-radius:var(--r) var(--r) 0 0;
  transition:background .3s,color .3s;
}
.miniMonIcon{font-size:23px;line-height:1;flex:none;image-rendering:pixelated;transition:transform .35s}
.miniMonName{flex:1}
.miniMon.hit{background:var(--no-soft);color:var(--no)}
.miniMon.hit .miniMonIcon{animation:monShake .4s}
.miniMon.defeated{background:var(--ok-soft);color:var(--ok)}
.miniMon.defeated .miniMonIcon{animation:monPop .45s}
@keyframes monShake{
  0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(-4px) rotate(-10deg)}
  40%{transform:translateX(4px) rotate(10deg)}
  60%{transform:translateX(-3px) rotate(-6deg)}
  80%{transform:translateX(3px) rotate(6deg)}
}
@keyframes monPop{
  0%{transform:scale(1) rotate(0)}
  40%{transform:scale(1.35) rotate(-12deg)}
  70%{transform:scale(.82) rotate(8deg)}
  100%{transform:scale(1) rotate(0)}
}
@media (prefers-reduced-motion:reduce){
  .miniMonIcon{animation:none!important}
}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.meta span{font-size:12.5px;color:var(--tx-2);background:var(--line-2);padding:4px 9px;border-radius:7px}
.meta .law{background:var(--warn-soft);color:var(--warn);font-weight:600}
.meta .ai{background:var(--brand-soft);color:var(--brand)}

.stem{font-size:19px;line-height:1.85;margin:0 0 8px;letter-spacing:.01em}
.passageBox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 12px}
.passageLab{font-size:12.5px;font-weight:700;color:var(--tx-2);margin-bottom:6px}
.passageGroup{font-weight:500;color:var(--tx-3)}
.passageTx{font-size:15.5px;line-height:1.8;color:var(--tx)}
.blankCur{background:var(--warn-soft);color:var(--warn);font-weight:700;padding:1px 6px;border-radius:6px}
.blankOther{color:var(--tx-3);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.infoBox{margin:0 0 10px}
.infoBox summary{cursor:pointer;list-style:none;font-size:13px;color:var(--tx-2);font-weight:600;
  display:inline-flex;align-items:center;gap:4px;padding:4px 0;-webkit-tap-highlight-color:transparent}
.infoBox summary::-webkit-details-marker{display:none}
.infoBox summary::after{content:'展開說明';color:var(--tx-3);font-weight:400}
.infoBox[open] summary::after{content:'收起說明'}
.infoBox .hint{margin:6px 0 0;padding:9px 11px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--tx-2);line-height:1.6}

.tip{font-size:12.5px;color:var(--tx-3);margin:0 0 14px;line-height:1.55}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:stretch;
  border:1.5px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--card);transition:border-color .12s,background .12s;
}
.opt .pick{
  flex:1;display:flex;align-items:flex-start;gap:11px;
  padding:14px 12px;font-size:16.5px;line-height:1.65;
}
.opt .k{
  flex:none;width:25px;height:25px;line-height:23px;text-align:center;
  border:1.5px solid var(--line);border-radius:50%;
  font-family:var(--num);font-size:13px;color:var(--tx-2);margin-top:1px;
}
.opt .del{
  flex:none;width:46px;border-left:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--tx-3);
}
.opt[data-cut="1"]{background:var(--bg)}
.opt[data-cut="1"] .pick{opacity:.4;text-decoration:line-through;text-decoration-color:var(--no);text-decoration-thickness:1.5px}
.opt[data-cut="1"] .del{color:var(--no);background:var(--no-soft)}
.opt[data-r="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.opt[data-r="ok"] .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt[data-r="no"]{border-color:var(--no);background:var(--no-soft)}
.opt[data-r="no"] .k{background:var(--no);border-color:var(--no);color:#fff}
.opt[data-r="sel"]{border-color:var(--brand);background:var(--brand-soft)}
.opt[data-r="sel"] .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt[data-r] .del{display:none}

.unsure{
  display:flex;align-items:center;gap:10px;width:100%;
  margin-top:12px;padding:13px 14px;border-radius:12px;
  border:1.5px dashed var(--line);font-size:15px;color:var(--tx-2);
}
.unsure .bx{width:19px;height:19px;flex:none;border:1.5px solid var(--line);border-radius:5px;font-size:13px;line-height:17px;text-align:center;color:transparent}
.unsure[aria-pressed="true"]{border-style:solid;border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.unsure[aria-pressed="true"] .bx{background:var(--warn);border-color:var(--warn);color:#fff}

/* ---- 批改結果 ---- */
.verdict{
  display:flex;align-items:center;gap:10px;
  margin:16px -16px 0;padding:14px 16px;
  font-size:17px;font-weight:600;
}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:var(--no-soft);color:var(--no)}
.verdict .t{font-size:24px;line-height:1}
.verdict .sp{margin-left:auto;font-family:var(--num);font-size:13px;font-weight:500;opacity:.8}

.sol{padding:16px 0 0;margin:0 -16px;border-top:1px solid var(--line-2)}
.sol > *{padding-left:16px;padding-right:16px}
.sol h4{font-size:13px;color:var(--tx-2);margin:0 0 8px;font-weight:600}
.sol p{margin:0 0 14px;font-size:16px;line-height:1.8}
.why{display:flex;gap:10px;font-size:14.5px;line-height:1.7;color:var(--tx-2);padding:9px 16px;border-top:1px solid var(--line-2)}
.why b{font-family:var(--num);flex:none;color:var(--tx);width:14px}

.dual{margin:14px 16px 0;border:1.5px solid var(--warn);border-radius:12px;overflow:hidden}
.dual h5{margin:0;padding:10px 13px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:700}
.dual .pr{display:flex}
.dual .pr > div{flex:1;padding:12px 13px;text-align:center}
.dual .pr > div + div{border-left:1px solid var(--line)}
.dual .lb{display:block;font-size:11.5px;color:var(--tx-2);margin-bottom:4px}
.dual .an{font-size:22px;font-weight:700;font-family:var(--num)}
.dual .nt{padding:12px 13px;border-top:1px solid var(--line-2);font-size:14px;line-height:1.7;color:var(--tx-2)}

.sched{
  margin:16px 16px 0;padding:11px 13px;background:var(--line-2);border-radius:10px;
  font-size:13px;color:var(--tx-2);line-height:1.6;
}
.sched b{color:var(--ok)}

/* ---- 統計 ---- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.kpi .v{font-family:var(--num);font-size:29px;font-weight:600;color:var(--brand);line-height:1.1}
.kpi .v small{font-size:14px;opacity:.6}
.kpi .l{font-size:13px;color:var(--tx-2);margin-top:6px}

.bar{padding:13px 15px}
.bar + .bar{border-top:1px solid var(--line-2)}
.bar .t{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:7px}
.bar .t .r{font-family:var(--num);font-size:13px;color:var(--tx-2)}
.bar .rail{height:7px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar .rail i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .5s}
.bar.w .rail i{background:var(--no)}
.bar.s .rail i{background:var(--ok)}

.it{display:flex;gap:12px;padding:13px 15px;align-items:flex-start}
.it + .it{border-top:1px solid var(--line-2)}
.it .n{font-family:var(--num);font-size:12px;color:var(--no);flex:none;margin-top:3px;font-weight:600}
.it .tx{flex:1;font-size:15px;line-height:1.6}
.it .m{display:block;font-size:12.5px;color:var(--tx-2);margin-top:5px;line-height:1.5}

.lad{display:flex;gap:5px;padding:15px}
.lad div{flex:1;text-align:center}
.lad .b{height:40px;line-height:38px;border:1px solid var(--line);border-radius:9px;font-family:var(--num);font-size:15px;color:var(--tx-2)}
.lad .l{font-size:10.5px;color:var(--tx-3);margin-top:5px}
.lad .due .b{border-color:var(--no);color:var(--no);background:var(--no-soft);font-weight:600}
.lad .fin .b{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

/* ---- 結算 ---- */
.score{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px 20px 26px;text-align:center}
.score .big{font-family:var(--num);font-size:58px;font-weight:600;color:var(--brand);line-height:1}
.score .big small{font-size:22px;opacity:.55}
.score .c{font-size:16px;margin-top:10px}
.score .m{font-size:13px;color:var(--tx-2);margin-top:6px}

/* ---- 冒險／RPG系統 ---- */
.charCard{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
}
.avatar{
  flex:none;width:56px;height:56px;border-radius:14px;
  background:var(--brand-soft);display:flex;align-items:center;justify-content:center;
  font-size:30px;border:2px solid var(--brand);cursor:pointer;
  image-rendering:pixelated;
}
.charInfo{flex:1;min-width:0}
.lvRow{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:16px}
.lvRow .gold{font-family:var(--num);font-weight:600;font-size:14px;color:var(--warn)}
.titleTag{font-size:11.5px;color:var(--brand);font-weight:600;margin-top:2px}
.xpBar{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;margin-top:8px}
.xpBar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
.xpLab{font-family:var(--num);font-size:11px;color:var(--tx-2);margin-top:4px}
.statRow{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 2px 0;font-size:14px;color:var(--tx-2)}

.dollWrap{
  position:relative;width:100%;max-width:280px;height:300px;margin:6px auto 10px;
}
.dollBody{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:92px;opacity:.92;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12));
  image-rendering:pixelated;
}
.dollSlot{
  position:absolute;width:46px;height:46px;border-radius:13px;
  background:var(--card);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:21px;
  cursor:pointer;transition:border-color .15s,transform .15s;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.dollSlot:active{transform:scale(.94)}
.dollSlot.filled{border-color:var(--brand);background:var(--brand-soft)}
.dollSlot.filled.rarity-common{border-color:#9AA0A6;background:rgba(154,160,166,.14)}
.dollSlot.filled.rarity-rare{border-color:#4C8DFF;background:rgba(76,141,255,.14)}
.dollSlot.filled.rarity-epic{border-color:#B356E0;background:rgba(179,86,224,.14)}
.dollSlot.filled.rarity-legendary{border-color:#E0A82E;background:rgba(224,168,46,.16)}
.dollSlot.filled.rarity-mythic{border-color:#E0472E;background:rgba(224,71,46,.16);box-shadow:0 0 10px rgba(224,71,46,.35)}
.dollSlot.active{border-color:var(--warn);border-width:2.5px}
.dollTierDot{
  position:absolute;bottom:-2px;right:-2px;width:13px;height:13px;border-radius:50%;

var KEY = 'waite-quiz-v2';
var KEY_BANK = 'waite-quiz-v2-bank';
var Store = {
  ws: (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function'),
  get: async function(){
    if (this.ws){ try { var r = await window.storage.get(KEY); if (r) return JSON.parse(r.value); } catch(e){} }
    try { var v = localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch(e){}
    return null;
  },
  set: async function(o){
    var s = JSON.stringify(o);
    if (this.ws){ try { await window.storage.set(KEY, s); } catch(e){} }
    try { localStorage.setItem(KEY, s); } catch(e){}
  },
  /* 題庫本身資料量大但很少變動（只有匯入/重置時才會變），跟作答進度、角色狀態分開存，
     避免每次作答、強化裝備等高頻動作都要把整包題庫重新序列化一次，減少不必要的效能負擔 */
  getBank: async function(){
    if (this.ws){ try { var r = await window.storage.get(KEY_BANK); if (r) return JSON.parse(r.value); } catch(e){} }
    try { var v = localStorage.getItem(KEY_BANK); if (v) return JSON.parse(v); } catch(e){}
    return null;

  setBank: async function(arr){
    var s = JSON.stringify(arr);
    if (this.ws){ try { await window.storage.set(KEY_BANK, s); } catch(e){} }
    try { localStorage.setItem(KEY_BANK, s); } catch(e){}
  }
};

function normalize(q){
  if (!q.exam && q.subject){

function computeTotalCorrect(){
  var sum = 0;
  Object.keys(D.progress).forEach(function(id){ sum += D.progress[id].right || 0; });
  return sum;
}
function achievementContext(){
  var stars = Object.keys(SUBJECT_ATTR).map(function(n){ return subjectMastery(n).stars; });
  var enchLv = Object.keys(D.rpg.enchant || {}).map(function(k){ return D.rpg.enchant[k]; });
  return {
    totalCorrect: computeTotalCorrect(),
    streakDays: streak(),
    bestCombo: D.rpg.bestCombo || 0,
    wins: D.rpg.wins || 0,
    lifetimeGold: D.rpg.lifetimeGold || 0,
    maxStar: stars.length ? Math.max.apply(null, stars) : 0,
    allStar: Object.keys(SUBJECT_ATTR).every(function(n){ return subjectMastery(n).stars >= 1; }),
    maxEnchant: enchLv.length ? Math.max.apply(null, enchLv) : 0,
    hasLegendary: D.rpg.inv.some(function(id){ var it = itemById(id); return it && it.rarity === 'legendary'; }),
    mythicCount: D.rpg.inv.filter(function(id){ var it = itemById(id); return it && it.rarity === 'mythic'; }).length,
    mythicTotal: ITEMS.filter(function(i){ return i.rarity === 'mythic'; }).length,
  };
}
function checkAchievements(){
  if (!Array.isArray(D.rpg.badges)) D.rpg.badges = [];
  var ctx = achievementContext(), changed = false;
  ACHIEVEMENTS.forEach(function(a){
    if (D.rpg.badges.indexOf(a.id) >= 0) return;
    if (!a.check(ctx)) return;
    D.rpg.badges.push(a.id);
    if (a.reward && a.reward.gold){ D.rpg.gold += a.reward.gold; D.rpg.lifetimeGold = (D.rpg.lifetimeGold||0) + a.reward.gold; }
    changed = true;
    showBadgeToast(a);
  });
  if (changed) save();
}
var TOAST_QUEUE = [];
var TOAST_SHOWING = false;
function showBadgeToast(a){
  TOAST_QUEUE.push(a);
  if (!TOAST_SHOWING) processToastQueue();
}
function processToastQueue(){
  if (!TOAST_QUEUE.length){ TOAST_SHOWING = false; return; }
  TOAST_SHOWING = true;
  var a = TOAST_QUEUE.shift();
  var el = document.createElement('div');
  el.className = 'badgeToast';
  el.innerHTML = '<span class="btIcon">' + a.icon + '</span>' +
    '<span class="btText"><b>解鎖成就！</b>' + esc(a.name) +
    (a.reward && a.reward.gold ? '　+' + a.reward.gold + '💰' : '') + '</span>';
  document.body.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){ el.remove(); processToastQueue(); }, 400);
  }, 2200);
}

/* 分科屬性：讀得越熟該科，對應屬性星級越高，提供小額永久加成 */
var SUBJECT_ATTR = {
  '國文':                 { attr:'學識', effect:'xpPct',   per:2, icon:'📖' },
  '綜合法政知識':          { attr:'意志', effect:'hp',      per:4, icon:'🛡️' },
  '外國文':                { attr:'敏捷', effect:'atk',     per:1, icon:'🌀' },
  '國際公法':              { attr:'謀略', effect:'goldPct', per:2, icon:'🧭' },
  '國際關係與近代外交史':   { attr:'統帥', effect:'atk',     per:1, icon:'🎖️' },
  '國際經濟':              { attr:'理財', effect:'goldPct', per:2, icon:'💹' },
};
function subjectMastery(examName){
  var pool = BANK.filter(function(q){ return q.exam === examName; });
  if (!pool.length) return { stars:0, total:0, mature:0 };
  var mature = pool.filter(function(q){ return matureQ(q.id); }).length;
  var stars = Math.min(5, Math.round(mature/pool.length*5));
  return { stars:stars, total:pool.length, mature:mature };
}
function subjectBonusTotal(effectKey){
  var sum = 0;
  Object.keys(SUBJECT_ATTR).forEach(function(name){
    var cfg = SUBJECT_ATTR[name];
    if (cfg.effect !== effectKey) return;
    sum += subjectMastery(name).stars * cfg.per;
  });
  return sum;
}

function xpForLevel(lv){ return 50 + lv*30; }
function addXp(amount){
  D.rpg.xp += amount;
  var leveled = false;
  while (D.rpg.xp >= xpForLevel(D.rpg.level)){
    D.rpg.xp -= xpForLevel(D.rpg.level);
    D.rpg.level++;
    leveled = true;
  }
  return leveled;
}
function itemById(id){ return ITEMS.filter(function(i){ return i.id === id; })[0]; }
function enchantLevel(id){ return (D.rpg.enchant && D.rpg.enchant[id]) || 0; }
function enchantCost(it, id){
  var lv = enchantLevel(id);
  var rarityMult = { common:1, rare:1.6, epic:2.4, legendary:3.5, mythic:5.5 }[it.rarity] || 1;
  return Math.round((25 + lv*20) * rarityMult);
}
function itemStatValue(it, id, key){
  var base = it[key];
  if (!base) return 0;
  var lv = enchantLevel(id);
  return Math.round(base * (1 + lv*0.12));
}
function equipList(dataSlot){
  var v = D.rpg.equip[dataSlot];
  if (Array.isArray(v)) return v.filter(Boolean);
  return v ? [v] : [];
}
function isEquipped(id){
  var eq = D.rpg.equip;
  if (eq.armor === id || eq.helmet === id || eq.boots === id) return true;
  if (Array.isArray(eq.weapon) && eq.weapon.indexOf(id) >= 0) return true;
  if (Array.isArray(eq.accessory) && eq.accessory.indexOf(id) >= 0) return true;
  if (Array.isArray(eq.relic) && eq.relic.indexOf(id) >= 0) return true;
  return false;
}
function rpgAtk(){
  var base = 8 + D.rpg.level*2;
  var eq = equipList('weapon').reduce(function(sum, wid){
    var w = itemById(wid); return sum + (w ? itemStatValue(w, wid, 'atk') : 0);
  }, 0);
  var relic = equipList('relic').reduce(function(sum, rid){
    var r = itemById(rid); return sum + (r ? itemStatValue(r, rid, 'atk') : 0);
  }, 0);
  return base + eq + relic + subjectBonusTotal('atk');
}
function rpgMaxHp(){
  var base = 40 + D.rpg.level*8, aid = D.rpg.equip.armor, a = itemById(aid);
  var eq = a ? itemStatValue(a, aid, 'hp') : 0;
  var relic = equipList('relic').reduce(function(sum, rid){
    var r = itemById(rid); return sum + (r ? itemStatValue(r, rid, 'hp') : 0);
  }, 0);
  return base + eq + relic + subjectBonusTotal('hp');
}
function rpgGoldMult(){
  var eq = equipList('accessory').reduce(function(sum, cid){
    var c = itemById(cid); return sum + (c ? itemStatValue(c, cid, 'goldPct') : 0);
  }, 0);
  var relic = equipList('relic').reduce(function(sum, rid){
    var r = itemById(rid); return sum + (r ? itemStatValue(r, rid, 'goldPct') : 0);
  }, 0);
  return 1 + (eq + relic + subjectBonusTotal('goldPct'))/100;
}
function rpgXpMult(){
  var eq = equipList('accessory').reduce(function(sum, cid){
    var c = itemById(cid); return sum + (c ? itemStatValue(c, cid, 'xpPct') : 0);
  }, 0);
  var relic = equipList('relic').reduce(function(sum, rid){
    var r = itemById(rid); return sum + (r ? itemStatValue(r, rid, 'xpPct') : 0);
  }, 0);
  return 1 + (eq + relic + subjectBonusTotal('xpPct'))/100;
}
function rpgLootBonus(){
  var hid = D.rpg.equip.helmet, h = itemById(hid);
  var base = h ? itemStatValue(h, hid, 'lootPct') : 0;
  var relic = equipList('relic').reduce(function(sum, rid){
    var r = itemById(rid); return sum + (r ? itemStatValue(r, rid, 'lootPct') : 0);
  }, 0);
  return base + relic;
}
function rpgDmgReduction(){
  var bid = D.rpg.equip.boots, b = itemById(bid);
  var v = b ? itemStatValue(b, bid, 'dmgReduction') : 0;
  var relic = equipList('relic').reduce(function(sum, rid){
    var r = itemById(rid); return sum + (r ? itemStatValue(r, rid, 'dmgReduction') : 0);
  }, 0);
  return Math.min(80, v + relic);
}
function rpgAward(ok, unsure, isWeak){
  var g, x;
  if (ok && !unsure){ g = Math.round((5 + D.rpg.level) * rpgGoldMult()); x = Math.round(8 * rpgXpMult()); }
  else if (ok && unsure){ g = Math.round((5 + D.rpg.level) / 2 * rpgGoldMult()); x = Math.round(4 * rpgXpMult()); }
  else { g = 0; x = 1; }
  if (isWeak) x = Math.round(x * 1.5); // 弱點加成：答對本來不熟的題目多給50%經驗
  D.rpg.gold += g;
  D.rpg.lifetimeGold = (D.rpg.lifetimeGold || 0) + g;
  var leveled = addXp(x);
  return { gold:g, xp:x, leveled:leveled };
}

function rollPracticeLoot(){
  var bonus = rpgLootBonus() / 100;
  var dropChance = Math.min(0.30, 0.08 + bonus * 0.15);
  if (Math.random() > dropChance) return null;
  var r = Math.random(), pool;
  if (r < 0.80) pool = ITEMS.filter(function(i){ return i.rarity === 'common'; });
  else if (r < 0.98) pool = ITEMS.filter(function(i){ return i.rarity === 'rare'; });
  else pool = ITEMS.filter(function(i){ return i.rarity === 'epic'; });
  if (!pool.length) return null;
  var unowned = pool.filter(function(i){ return D.rpg.inv.indexOf(i.id) < 0; });
  var pick = unowned.length ? unowned : pool;
  return pick[Math.floor(Math.random() * pick.length)];
}
/* 練習模式專屬：強化石。答對就有機會掉，答對「本來不熟」的弱點題機率更高、也可能一次拿到2顆 */
function rollEnchantStone(isWeak){
  var chance = isWeak ? 0.30 : 0.12;
  if (Math.random() > chance) return 0;
  return (isWeak && Math.random() < 0.3) ? 2 : 1;
}
/* 挑戰模式（打怪）專屬：突破結晶。只有打怪勝利才會掉，怪物等級越高機率越高 */
var BREAK_STONE_CHANCE = { weak:0.05, normal:0.10, elite:0.20, boss:0.45 };
function rollBreakStone(tierKey){
  var chance = BREAK_STONE_CHANCE[tierKey] || 0.10;
  if (Math.random() > chance) return 0;
  return tierKey === 'boss' ? 2 : 1;
}
function rollLoot(){
  var bonus = rpgLootBonus() / 100;
  var noneChance = Math.max(0.15, 0.55 - bonus);
  var r = Math.random(), pool;
  if (r < noneChance) return null;
  var x = (r - noneChance) / (1 - noneChance);
  if (x < 0.25/0.45) pool = ITEMS.filter(function(i){ return i.rarity === 'common'; });
  else if (x < (0.25+0.14)/0.45) pool = ITEMS.filter(function(i){ return i.rarity === 'rare'; });
  else if (x < (0.25+0.14+0.05)/0.45) pool = ITEMS.filter(function(i){ return i.rarity === 'epic'; });
  else pool = ITEMS.filter(function(i){ return i.rarity === 'legendary'; });
  if (!pool.length) return null;
  var unowned = pool.filter(function(i){ return D.rpg.inv.indexOf(i.id) < 0; });
  var pick = unowned.length ? unowned : pool;
  return pick[Math.floor(Math.random() * pick.length)];
}

          '<button class="sw" id="swL" aria-pressed="' + st.limit + '" aria-label="倒數計時"></button></div>'
        : '') +
      '<div class="row"><div><div class="lab">跳過已熟練的題目</div><div class="hint">複習排程中尚未到期的題目不再出現，共 ' +
        BANK.filter(function(q){ return (!st.subjects.length || st.subjects.indexOf(q.exam) >= 0) && (!st.parts || !st.parts.length || !q.part || st.parts.indexOf(q.part) >= 0) && matureQ(q.id); }).length + ' 題</div></div>' +
        '<button class="sw" id="swM" aria-pressed="' + st.skipMature + '" aria-label="跳過已熟練"></button></div>' +
      '<div class="row"><div><div class="lab">優先出全新題目</div><div class="hint">開啟後優先出「沒做過」的題目，到期複習題往後排；關閉則維持預設，到期複習題優先</div></div>' +
        '<button class="sw" id="swN" aria-pressed="' + !!st.prioritizeNew + '" aria-label="優先出全新題目"></button></div>' +
    '</div>' +

    '<button class="btn" id="go" ' + (p.length ? '' : 'disabled') + '>' +
      (p.length === 0 ? '沒有符合條件的題目'
        : (st.mode === 'single' ? '開始作答' : '開始考卷（' + Math.min(st.count, p.length) + ' 題）')) +
    '</button>';

  $('#topRight').textContent = '題庫 ' + BANK.length + ' 題';

  Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function(b){
    b.onclick = function(){ D.settings.mode = b.dataset.m; save(); renderDrill(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#subs .chip'), function(b){
    b.onclick = function(){
      var a = D.settings.subjects, i = a.indexOf(b.dataset.s);
      if (i < 0) a.push(b.dataset.s); else a.splice(i,1);
      // 取消考科時，一併清掉不再適用的子科目
      var ok = partsInPlay();
      D.settings.parts = (D.settings.parts || []).filter(function(p){ return ok.indexOf(p) >= 0; });
      save(); renderDrill();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#prts .chip'), function(b){
    b.onclick = function(){
      if (!D.settings.parts) D.settings.parts = [];
      var a = D.settings.parts, i = a.indexOf(b.dataset.p);
      if (i < 0){
        a.push(b.dataset.p);
        // 選了子科目就自動把「綜合法政知識」納入範圍，避免出到別科的題
        EXAMS.forEach(function(e){
          if (e.parts.indexOf(b.dataset.p) >= 0 && D.settings.subjects.indexOf(e.name) < 0)
            D.settings.subjects.push(e.name);
        });
      } else a.splice(i,1);
      save(); renderDrill();
    };
  });
  var cu = $('#cu'), cd = $('#cd'), swL = $('#swL');
  if (cu) cu.onclick = function(){ D.settings.count = Math.min(pool().length || 1, D.settings.count + 5); save(); renderDrill(); };
  if (cd) cd.onclick = function(){ D.settings.count = Math.max(5, D.settings.count - 5); save(); renderDrill(); };
  if (swL) swL.onclick = function(){ D.settings.limit = !D.settings.limit; save(); renderDrill(); };
  $('#swM').onclick = function(){ D.settings.skipMature = !D.settings.skipMature; save(); renderDrill(); };
  $('#swN').onclick = function(){ D.settings.prioritizeNew = !D.settings.prioritizeNew; save(); renderDrill(); };
  $('#go').onclick = function(){ D.settings.mode === 'single' ? startSingle(pool(), null, { refreshSrc: function(){ return pool().map(function(q){ return q.id; }); } }) : startPaper(pool()); };
}

/* ===================== 單題作答 ===================== */
function startSingle(list, label, opts){
  opts = opts || {};
  S = { mode:'single', label: label || '單題作答', src: list.map(function(q){ return q.id; }),
        used: [], id:null, pick:null, cut:[], unsure:false, graded:false,
        n:0, right:0, ms:0, qStart:0, combo:0,
        refreshSrc: opts.refreshSrc || null, noNewLeft:false };
  nextSingle();
}

function pickNext(){
  var rest = S.src.filter(function(id){ return S.used.indexOf(id) < 0; });
  if (!rest.length){
    if (S.refreshSrc){
      // 一輪跑完時，先依目前設定重新抓一次（會自動排除掉這一輪剛作答完、還沒到期的題目）
      var fresh2 = S.refreshSrc();
      S.src = fresh2.length ? fresh2 : poolIgnoreMature().map(function(q){ return q.id; });
    }
    S.used = [];
    rest = S.src.slice();
  }
  if (!rest.length) return null;
  var due = rest.filter(dueQ), fresh = rest.filter(function(id){ return !seenQ(id); });
  S.noNewLeft = false;
  var firstBag = D.settings.prioritizeNew ? fresh : due;
  var secondBag = D.settings.prioritizeNew ? due : fresh;
  if (firstBag.length) return firstBag[Math.floor(Math.random() * firstBag.length)];
  if (secondBag.length) return secondBag[Math.floor(Math.random() * secondBag.length)];
  // 這個範圍目前沒有到期或沒做過的題目了：依「最久沒作答」排序後用偏態亂數挑選，
  // 越久沒做的越容易被抽到，避免一直重複最近才做過的（不管是這裡自然遇到、還是上面重置後遇到都適用）
  S.noNewLeft = true;
  var sorted = rest.slice().sort(function(a, b){
    var ap = D.progress[a] ? D.progress[a].at : 0, bp = D.progress[b] ? D.progress[b].at : 0;
    return ap - bp;
  });
  var idx = Math.floor(Math.pow(Math.random(), 2) * sorted.length);
  return sorted[Math.min(idx, sorted.length - 1)];
}

function nextSingle(){
  var id = pickNext();
  if (!id){ endSingle(); return; }
  S.id = id; S.pick = null; S.cut = []; S.unsure = false; S.graded = false; S.qStart = Date.now();
  S.mMon = miniMonsterFor(); S.lastLoot = null; S.lastStone = 0;
  S.used.push(id);
  renderSingle();
}

function renderSingle(){
  var q = BANK.filter(function(x){ return x.id === S.id; })[0];
  if (!q){ endSingle(); return; }
  var lg = q.legal || {}, ok = S.graded && S.pick === q.answer;

  $('#s-drill').innerHTML =
    '<div class="qtop">' +
      '<button class="x" id="quit" aria-label="儲存並離開">✕</button>' +
      '<span class="mid">第 ' + S.used.length + ' 題' +
        (S.n ? '　已答 ' + S.n + '・正確 ' + S.right : '') + '</span>' +
      '<span class="clk" id="clk">00:00</span>' +
    '</div>' +

    (S.noNewLeft ? '<p class="hint" style="margin:0 0 10px">📚 這個範圍目前沒有到期或沒做過的題目了，以下改為複習題（越久沒做的越容易出現）。</p>' : '') +

    '<div class="q">' +
      '<div class="' + (S.graded ? (ok ? 'miniMon defeated' : 'miniMon hit') : 'miniMon') + '">' +
        '<span class="miniMonIcon">' + S.mMon.icon + '</span>' +
        '<span class="miniMonName">' +
          (S.graded ? (ok ? '擊倒了「' + esc(S.mMon.name) + '」！' : '被「' + esc(S.mMon.name) + '」反擊了…')
                    : '遭遇「' + esc(S.mMon.name) + '」，準備應戰！') +
        '</span>' +
      '</div>' +
      (S.graded && S.lastLoot
        ? '<div class="lootBox rarity-' + S.lastLoot.rarity + '"><span class="itIcon">' + S.lastLoot.icon + '</span>掉落「' + esc(S.lastLoot.name) + '」' + (statText(S.lastLoot) ? '　' + statText(S.lastLoot) : '') + '</div>'
        : '') +
      (S.graded && S.lastStone
        ? '<div class="lootBox stoneBox">🔹 獲得 ' + S.lastStone + ' 顆強化石' + (S.lastStone > 1 ? '（弱點加成！）' : '') + '</div>'
        : '') +
      '<div class="meta">' +
        lineage(q).map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') +
        '<span class="' + (/生成|AI/.test(q.source || '') ? 'ai' : '') + '">' + esc(q.source || '未註明來源') + '</span>' +
        (lg.flagged ? '<span class="law">⚠ 法規時效</span>' : '') +
      '</div>' +

      passageHTML(q) + '<p class="stem">' + esc(q.stem) + '</p>' +
      (S.graded ? '' : '<p class="tip">點選項即作答。右側 ✕ 可先刪去確定錯誤的選項，不會送出答案。</p>') +

      '<div class="opts" id="opts">' + optsHTML(q, ok) + '</div>' +

      (S.graded ? '' :
        '<button class="unsure" id="uns" aria-pressed="' + S.unsure + '">' +
          '<span class="bx">✓</span><span>我不太確定 — 答對也排進複習</span></button>') +

      (S.graded ? verdictHTML(q, ok) + solHTML(q) : '') +
    '</div>' +

    (S.graded
      ? '<button class="btn" id="nx">下一題</button>' +
        '<button class="btn sec" id="stop">儲存進度並離開</button>'
      : '');

  bindOpts(q);
  var u = $('#uns');
  if (u) u.onclick = function(){ S.unsure = !S.unsure; var y = window.scrollY; renderSingle(); window.scrollTo(0, y); };
  $('#quit').onclick = function(){ endSingle(); };
  var nx = $('#nx'), st = $('#stop');
  if (nx) nx.onclick = function(){ nextSingle(); };
  if (st) st.onclick = function(){ endSingle(); };

  S.graded ? stopClock() : startClock();
  window.scrollTo(0,0);
}

function optsHTML(q, ok){
  return q.options.map(function(o, i){
    var r = '';
    if (S.graded){
      if (i === q.answer) r = 'ok';
      else if (i === S.pick) r = 'no';
    } else if (S.pick === i) r = 'sel';
    return '<div class="opt" data-cut="' + (S.cut.indexOf(i) >= 0 ? 1 : 0) + '"' + (r ? ' data-r="' + r + '"' : '') + '>' +
      '<button class="pick" data-i="' + i + '"' + (S.graded ? ' disabled' : '') + '>' +
        '<span class="k">' + KEYS[i] + '</span><span>' + esc(o) + '</span></button>' +
      (S.graded ? '' : '<button class="del" data-c="' + i + '" aria-label="刪去選項 ' + KEYS[i] + '">✕</button>') +
      '</div>';
  }).join('');
}

function bindOpts(q){
  Array.prototype.forEach.call(document.querySelectorAll('#opts .pick'), function(b){
    b.onclick = function(){
      if (S.graded) return;
      S.pick = parseInt(b.dataset.i, 10);
      var k = S.cut.indexOf(S.pick); if (k >= 0) S.cut.splice(k,1);
      if (S.mode === 'single') grade(q); else if (S.mode === 'battle') battleGrade(q); else { paperAnswer(q); }
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#opts .del'), function(b){
    b.onclick = function(){
      if (S.graded) return;
      var i = parseInt(b.dataset.c, 10), k = S.cut.indexOf(i);
      if (k < 0) S.cut.push(i); else S.cut.splice(k,1);
      if (S.pick === i) S.pick = null;
      var y = window.scrollY;
      S.mode === 'single' ? renderSingle() : (S.mode === 'battle' ? renderBattle() : renderPaper());
      window.scrollTo(0, y);
    };
  });
}

function grade(q){
  var spent = Date.now() - S.qStart;
  var ok = S.pick === q.answer;
  var p = P(q.id);
  var priorLv = p.lv; // 弱點加成：記錄本次作答前的熟練度，判斷這是不是你的弱點題
  p.seen++; p.ms += spent; p.at = Date.now();
  if (ok) p.right++; else p.wrong++;
  if (S.unsure) p.unsure++;

  if (!ok) p.lv = Math.max(0, p.lv - 1);
  else if (S.unsure) p.lv = Math.max(1, p.lv);
  else p.lv = Math.min(MAX_LV, p.lv + 1);
  p.due = Date.now() + ((!ok || S.unsure) ? 1 : INTERVALS[p.lv]) * DAY;

  if (D.days.indexOf(today()) < 0) D.days.push(today());

  S.graded = true; S.lastMs = spent; S.n++; if (ok) S.right++; S.ms += spent;
  var isWeak = ok && !S.unsure && priorLv <= 1; // 熟練度低（0～1階）代表這本來是你的弱點
  S.lastReward = rpgAward(ok, S.unsure, isWeak);
  S.lastLoot = ok ? rollPracticeLoot() : null;
  if (S.lastLoot) D.rpg.inv.push(S.lastLoot.id);
  S.lastStone = ok ? rollEnchantStone(isWeak) : 0;
  if (S.lastStone) D.rpg.enchantStone = (D.rpg.enchantStone || 0) + S.lastStone;
  if (ok){ S.combo = (S.combo||0) + 1; if (S.combo > (D.rpg.bestCombo||0)) D.rpg.bestCombo = S.combo; }
  else { S.combo = 0; }
  save(); refreshBadge(); checkAchievements(); renderSingle();
}

function verdictHTML(q, ok){
  var rewardBit = '';
  if (S.mode !== 'battle' && S.lastReward){
    var r = S.lastReward;
    rewardBit = ' <span class="rw">+' + r.gold + '💰 +' + r.xp + '⭐' + (r.leveled ? ' 🎉升級！' : '') + '</span>';
  }
  return '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' +
    '<span class="t">' + (ok ? '✓' : '✕') + '</span>' +
    '<span>' + (ok ? (S.unsure ? '答對了，但你標記為不確定' : '答對了') :
                     ('答錯了，正解是 ' + KEYS[q.answer])) + rewardBit + '</span>' +
    '<span class="sp">' + secs(S.lastMs || 0) + '</span></div>';
}

function solHTML(q){
  var lg = q.legal || {}, p = D.progress[q.id] || {};
  var gap = Math.max(1, Math.round((p.due - Date.now()) / DAY));
  var nx = p.lv >= MAX_LV ? '已達熟練，不再排入複習'
         : '<b>' + gap + ' 天後</b>會再出現一次（熟練度 L' + p.lv + ' / ' + MAX_LV + '）';
  return '<div class="sol">' +
      '<h4>解析</h4><p>' + esc(q.explanation || '（尚未填寫詳解）') + '</p>' +
      ((q.why && q.why.length) ? q.why.map(function(w, i){
        return '<div class="why"><b>' + KEYS[i] + '</b><span>' + esc(w) + '</span></div>'; }).join('') : '') +
      (lg.flagged
        ? '<div class="dual"><h5>⚠ 這題可能因修法或釋憲而變動</h5>' +
            '<div class="pr">' +
              '<div><span class="lb">當年公布答案</span><span class="an">' + KEYS[lg.oldAnswer != null ? lg.oldAnswer : q.answer] + '</span></div>' +
              '<div><span class="lb">現行法下答案</span><span class="an">' + KEYS[q.answer] + '</span></div>' +
            '</div>' +
            (lg.note ? '<div class="nt">' + esc(lg.note) + '</div>' : '') +
          '</div>'
        : '') +
      '<div class="sched">' + nx + '</div>' +
    '</div>';
}

function endSingle(){
  stopClock();
  var n = S.n, r = S.right, ms = S.ms;
  S = null; save();
  if (!n){ renderDrill(); return; }
  $('#s-drill').innerHTML =
    '<h2 class="sec">本次練習</h2>' +
    '<div class="score">' +
      '<div class="big">' + Math.round(r/n*100) + '<small>%</small></div>' +
      '<div class="c">' + n + ' 題中答對 ' + r + ' 題</div>' +
      '<div class="m">總計 ' + secs(ms) + '・平均每題 ' + secs(ms/n) + '</div>' +
    '</div>' +
    '<button class="btn" id="again">再開始一輪</button>' +
    '<button class="btn sec" id="home">回到設定</button>';
  $('#again').onclick = function(){ startSingle(pool(), null, { refreshSrc: function(){ return pool().map(function(q){ return q.id; }); } }); };
  $('#home').onclick = function(){ renderDrill(); };
  refreshBadge();
}

/* ===================== 考卷模式 ===================== */
function startPaper(list){
  var qs = list.slice();
  qs.sort(function(){ return Math.random() - .5; });
  qs = qs.slice(0, Math.min(D.settings.count, qs.length));
  S = { mode:'paper', label:'整份考卷', ids: qs.map(function(q){ return q.id; }), i:0,
        ans:{}, cuts:{}, uns:{}, times:{}, pick:null, cut:[], unsure:false, graded:false,
        limit: D.settings.limit ? 90000 * qs.length : 0, start: Date.now(), qStart: Date.now() };
  renderPaper();
}

function renderPaper(){
  var id = S.ids[S.i], q = BANK.filter(function(x){ return x.id === id; })[0];
  if (!q){ finishPaper(); return; }
  S.pick = S.ans[id] != null ? S.ans[id] : null;
  S.cut = S.cuts[id] || [];
  S.unsure = !!S.uns[id];
  S.graded = false;

  $('#s-drill').innerHTML =
    '<div class="qtop">' +
      '<button class="x" id="quit" aria-label="放棄本份考卷">✕</button>' +
      '<span class="mid">第 ' + (S.i+1) + ' / ' + S.ids.length + ' 題</span>' +
      '<span class="clk" id="clk">00:00</span>' +
    '</div>' +
    '<div class="prog"><i style="width:' + ((S.i+1)/S.ids.length*100).toFixed(1) + '%"></i></div>' +

    '<div class="q">' +
      '<div class="meta">' + lineage(q).map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') +
        '<span>' + esc(q.source || '未註明來源') + '</span></div>' +
      passageHTML(q) + '<p class="stem">' + esc(q.stem) + '</p>' +
      '<p class="tip">考卷模式作答後不顯示對錯，交卷才統一批改。</p>' +
      '<div class="opts" id="opts">' + optsHTML(q, false) + '</div>' +
      '<button class="unsure" id="uns" aria-pressed="' + S.unsure + '">' +
        '<span class="bx">✓</span><span>我不太確定 — 答對也排進複習</span></button>' +
    '</div>' +

    '<div style="display:flex;gap:10px;margin-top:14px">' +
      '<button class="btn sec tiny" id="prev" style="flex:1;margin-top:0"' + (S.i === 0 ? ' disabled' : '') + '>上一題</button>' +
      '<button class="btn tiny" id="next" style="flex:1;margin-top:0">' +
        (S.i + 1 >= S.ids.length ? '交卷' : '下一題') + '</button>' +
    '</div>' +
    '<button class="btn sec tiny" id="sub">直接交卷（未作答視為錯）</button>';

  bindOpts(q);
  $('#uns').onclick = function(){ S.unsure = !S.unsure; S.uns[id] = S.unsure; var y = window.scrollY; renderPaper(); window.scrollTo(0, y); };
  $('#quit').onclick = function(){ if (confirm('放棄這份考卷？已作答的題目不會計入進度。')){ stopClock(); S = null; renderDrill(); } };
  $('#prev').onclick = function(){ S.i = Math.max(0, S.i - 1); renderPaper(); };
  $('#next').onclick = function(){
    if (S.i + 1 >= S.ids.length) finishPaper();
    else { S.i++; S.qStart = Date.now(); renderPaper(); }
  };
  $('#sub').onclick = function(){ if (confirm('現在交卷？')) finishPaper(); };
  startClock();
  window.scrollTo(0,0);
}

function paperAnswer(q){
  S.ans[q.id] = S.pick;
  S.cuts[q.id] = S.cut;
  S.times[q.id] = (S.times[q.id] || 0) + (Date.now() - S.qStart);
  S.qStart = Date.now();
  renderPaper();
}

function finishPaper(){
  stopClock();
  var qs = S.ids.map(function(id){ return BANK.filter(function(x){ return x.id === id; })[0]; }).filter(Boolean);
  var right = 0, total = 0, wrong = [], risky = [], totalGold = 0, totalXp = 0, leveledUp = false;

  qs.forEach(function(q){
    var pick = S.ans[q.id], ok = pick === q.answer, uns = !!S.uns[q.id];
    var t = S.times[q.id] || 0; total += t;
    var p = P(q.id);
    p.seen++; p.ms += t; p.at = Date.now();
    if (ok){ p.right++; right++; } else { p.wrong++; wrong.push(q); }
    if (uns){ p.unsure++; if (ok) risky.push(q); }
    if (!ok) p.lv = Math.max(0, p.lv - 1);
    else if (uns) p.lv = Math.max(1, p.lv);
    else p.lv = Math.min(MAX_LV, p.lv + 1);
    p.due = Date.now() + ((!ok || uns) ? 1 : INTERVALS[p.lv]) * DAY;
    var rw = rpgAward(ok, uns);
    totalGold += rw.gold; totalXp += rw.xp; if (rw.leveled) leveledUp = true;
  });
  if (D.days.indexOf(today()) < 0) D.days.push(today());
  save(); refreshBadge(); checkAchievements();

  var wrongList = wrong.slice();
  S = null;

  $('#s-drill').innerHTML =
    '<h2 class="sec">考卷結果</h2>' +
    '<div class="score">' +
      '<div class="big">' + Math.round(right/Math.max(1,qs.length)*100) + '<small>%</small></div>' +
      '<div class="c">' + qs.length + ' 題中答對 ' + right + ' 題</div>' +
      '<div class="m">總計 ' + secs(total) + '・平均每題 ' + secs(total/Math.max(1,qs.length)) + '</div>' +
      '<div class="m" style="margin-top:8px">獲得 +' + totalGold + '💰　+' + totalXp + '⭐' + (leveledUp ? '　🎉升級！' : '') + '</div>' +
    '</div>' +
    (risky.length ? '<h2 class="sec">答對但沒把握 ' + risky.length + ' 題</h2><div class="card">' +
      risky.map(itemHTML).join('') + '</div>' : '') +
    (wrongList.length ? '<h2 class="sec">答錯 ' + wrongList.length + ' 題</h2><div class="card">' +
      wrongList.map(itemHTML).join('') + '</div>' : '') +
    (wrongList.length ? '<button class="btn" id="redo">立刻檢討這 ' + wrongList.length + ' 題</button>' : '') +
    '<button class="btn sec" id="home">回到設定</button>';

function renderStats(){
  var seen = BANK.filter(function(q){ return seenQ(q.id); });
  if (!seen.length){
    $('#s-stats').innerHTML = '<div class="empty"><b>還沒有作答紀錄</b>做完第一題後，這裡會顯示各科正確率、答題速度與弱點主題。</div>';
    return;
  }
  var att = 0, rt = 0, ms = 0;
  seen.forEach(function(q){ var p = D.progress[q.id]; att += p.seen; rt += p.right; ms += p.ms; });

  function group(fn){
    var m = {};
    seen.forEach(function(q){
      var k = fn(q); if (!k) return;
      if (!m[k]) m[k] = { seen:0, right:0, ms:0 };
      var p = D.progress[q.id];
      m[k].seen += p.seen; m[k].right += p.right; m[k].ms += p.ms;
    });
    return Object.keys(m).map(function(k){
      return { k:k, seen:m[k].seen, right:m[k].right, ms:m[k].ms,
               acc: Math.round(m[k].right / Math.max(1, m[k].seen) * 100) };
    });
  }
  function bar(x, showAcc){
    var cls = showAcc ? (x.acc < 60 ? ' w' : (x.acc >= 85 ? ' s' : '')) : '';
    var w = showAcc ? x.acc : Math.min(100, (x.ms/x.seen)/120000*100);
    var right = showAcc ? (x.acc + '%　' + x.right + '/' + x.seen) : secs(x.ms/x.seen) + ' / 題';
    return '<div class="bar' + cls + '"><div class="t"><span>' + esc(x.k) + '</span>' +
      '<span class="r">' + right + '</span></div>' +
      '<div class="rail"><i style="width:' + w.toFixed(0) + '%"></i></div></div>';
  }

  var bySub = group(function(q){ return q.exam; }).sort(function(a,b){ return a.acc - b.acc; });
  var byTop = group(function(q){ return q.part ? (q.part + '・' + (q.topic || '其他')) : q.topic; })
                .filter(function(x){ return x.seen >= 2; })
                .sort(function(a,b){ return a.acc - b.acc; });

  $('#s-stats').innerHTML =
    '<h2 class="sec">總覽</h2>' +
    '<div class="kpis">' +
      '<div class="kpi"><div class="v">' + Math.round(rt/Math.max(1,att)*100) + '<small>%</small></div><div class="l">總正確率</div></div>' +
      '<div class="kpi"><div class="v">' + att + '</div><div class="l">累計作答題次</div></div>' +
      '<div class="kpi"><div class="v">' + Math.round(ms/Math.max(1,att)/1000) + '<small>秒</small></div><div class="l">每題平均耗時</div></div>' +
      '<div class="kpi"><div class="v">' + streak() + '</div><div class="l">連續練習天數</div></div>' +
    '</div>' +

    '<h2 class="sec">各科正確率（由弱到強）</h2>' +
    '<div class="card">' + bySub.map(function(x){ return bar(x, true); }).join('') + '</div>' +

    (byTop.length ? '<h2 class="sec">子科目與主題強弱</h2><div class="card">' +
      byTop.slice(0,10).map(function(x){ return bar(x, true); }).join('') + '</div>' : '') +

    '<h2 class="sec">答題速度</h2>' +
    '<div class="card">' +
      bySub.slice().sort(function(a,b){ return b.ms/b.seen - a.ms/a.seen; })
        .map(function(x){ return bar(x, false); }).join('') +
    '</div>' +
    '<p class="hint" style="padding:0 4px;margin:9px 0 0">滿格為 2 分鐘。三等選擇題每題約 60–90 秒是合理節奏。</p>' +

    '<h2 class="sec">題庫涵蓋率</h2>' +
    '<div class="card">' + EXAM_NAMES.filter(function(s){ return countBy(function(q){ return q.exam; }, s); }).map(function(s){
      var all = BANK.filter(function(q){ return q.exam === s; }).length;
      var done = BANK.filter(function(q){ return q.exam === s && seenQ(q.id); }).length;
      return '<div class="bar"><div class="t"><span>' + esc(s) + '</span><span class="r">' + done + ' / ' + all + '</span></div>' +
        '<div class="rail"><i style="width:' + (done/Math.max(1,all)*100).toFixed(0) + '%"></i></div></div>';
    }).join('') + '</div>';
}

function streak(){
  if (!D.days.length) return 0;
  var set = {}; D.days.forEach(function(d){ set[d] = 1; });
  var n = 0, d = new Date();
  if (!set[d.toISOString().slice(0,10)]) d.setDate(d.getDate() - 1);
  while (set[d.toISOString().slice(0,10)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

function doImport(rawText){
  var m = $('#m1'), raw = String(rawText || '').trim(), obj;
  if (!raw){ m.innerHTML = '<div class="msg err">請先貼上內容。</div>'; return; }
  try { obj = JSON.parse(raw); }
  catch(e){ m.innerHTML = '<div class="msg err">JSON 格式有誤：' + esc(e.message) +
    '。常見原因是缺逗號、引號未成對，或使用了全形標點。</div>'; return; }

  // 備份檔還原
  if (obj && obj._backup && Array.isArray(obj.bank)){
    BANK = normalizeAll(obj.bank);
    D.progress = obj.progress || {}; D.days = obj.days || [];
    D.rpg = Object.assign({}, DEF_RPG, obj.rpg || {});
    D.rpg.equip = migrateEquip(Object.assign({}, DEF_RPG.equip, (obj.rpg && obj.rpg.equip) || {}));
    D.rpg.enchant = Object.assign({}, (obj.rpg && obj.rpg.enchant) || {});
    D.rpg.bossKills = Object.assign({}, (obj.rpg && obj.rpg.bossKills) || {});
    D.rpg.bossLog = (obj.rpg && Array.isArray(obj.rpg.bossLog)) ? obj.rpg.bossLog.slice() : [];
    if (!Array.isArray(D.rpg.inv)) D.rpg.inv = [];
    D.rpg.badges = (obj.rpg && Array.isArray(obj.rpg.badges)) ? obj.rpg.badges.slice() : [];
    saveBank(); save(); refreshBadge(); checkAchievements(); renderDrill();
    m.innerHTML = '<div class="msg ok">備份已還原：題庫 ' + BANK.length + ' 題，作答紀錄' +
      (obj.rpg ? '與冒險頁進度' : '') + '一併回復。' +
      (obj.rpg ? '' : '（這份備份檔不含冒險頁資料，角色已從預設值重新開始）') + '</div>';
    $('#ta').value = ''; setTimeout(renderBank, 400); return;
  }

  if (!Array.isArray(obj)){ m.innerHTML = '<div class="msg err">最外層必須是陣列，請用 [ ] 包住所有題目。</div>'; return; }

  var bad = [];
  obj.forEach(function(q, i){
    if (!q || !q.id) bad.push('第 ' + (i+1) + ' 題缺少 id');
    else if (!q.stem) bad.push(q.id + ' 缺少 stem');
    else if (!Array.isArray(q.options) || q.options.length < 2) bad.push(q.id + ' 的 options 至少要 2 個');
    else if (typeof q.answer !== 'number' || q.answer < 0 || q.answer >= q.options.length) bad.push(q.id + ' 的 answer 超出選項範圍');
    else if (!q.exam && !q.subject) bad.push(q.id + ' 缺少 exam（考科）');
    else if (q.exam && EXAM_NAMES.indexOf(q.exam) < 0 && !LEGACY[q.exam]) bad.push(q.id + ' 的 exam「' + q.exam + '」不在六大考科之內');
  });
  if (bad.length){ m.innerHTML = '<div class="msg err">' + bad.slice(0,6).map(esc).join('<br>') +
    (bad.length > 6 ? '<br>…另有 ' + (bad.length-6) + ' 筆' : '') + '</div>'; return; }

  var add = 0, upd = 0;
  obj.forEach(function(q){
    var i = -1;
    BANK.forEach(function(x, k){ if (x.id === q.id) i = k; });
    normalize(q);
    if (i >= 0){ BANK[i] = q; upd++; } else { BANK.push(q); add++; }
  });
  saveBank(); save();
  m.innerHTML = '<div class="msg ok">匯入完成：新增 ' + add + ' 題、更新 ' + upd + ' 題，題庫共 ' + BANK.length + ' 題。</div>';
  $('#ta').value = '';
  setTimeout(function(){ renderBank(); }, 400);
}

var THEME_SEQ = ['auto', 'light', 'dark'];
var THEME_META = {
  auto:  { ic: '🌓', lb: '自動' },
  light: { ic: '☀️', lb: '淺色' },
  dark:  { ic: '🌙', lb: '深色' }
};
function applyTheme(t){
  if (THEME_SEQ.indexOf(t) < 0) t = 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  var ic = $('#themeIc'), lb = $('#themeLb'), btn = $('#themeBtn');
  if (ic) ic.textContent = THEME_META[t].ic;
  if (lb) lb.textContent = THEME_META[t].lb;
  if (btn) btn.setAttribute('aria-label', '目前顯示模式：' + THEME_META[t].lb + '，點擊切換');
  var mc = document.querySelector('meta[name="theme-color"]');
  if (mc){
    var dark = (t === 'dark') || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    mc.setAttribute('content', dark ? '#131417' : '#FAFAF8');
  }
}
function cycleTheme(){
  var cur = D.settings.theme || 'auto';
  var next = THEME_SEQ[(THEME_SEQ.indexOf(cur) + 1) % THEME_SEQ.length];
  D.settings.theme = next;
  save();
  applyTheme(next);
}
